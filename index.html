,059.80元。标准API费率，5000万普通输入加5000万输出\" data-price=\"8059.80\"\u003e\u003cdiv class=\"model-price-head\"\u003e\u003cspan class=\"model-price-label\"\u003eClaude Opus 5.5 API · 标准\u003c/span\u003e\u003cspan class=\"model-price-value\"\u003e¥8,059.80\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"model-price-track\" aria-hidden=\"true\"\u003e\u003cspan class=\"model-price-fill\" style=\"width:40.00000000%\"\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"model-price-row\" role=\"listitem\" aria-label=\"Claude Fable 5.1 API · 标准：每1亿Token参考花费20,149.50元。标准API费率，5000万普通输入加5000万输出\" data-price=\"20149.50\"\u003e\u003cdiv class=\"model-price-head\"\u003e\u003cspan class=\"model-price-label\"\u003eClaude Fable 5.1 API · 标准\u003c/span\u003e\u003cspan class=\"model-price-value\"\u003e¥20,149.50\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"model-price-track\" aria-hidden=\"true\"\u003e\u003cspan class=\"model-price-fill\" style=\"width:100.00000000%\"\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003c/figure\u003e\n\u003cp\u003e套餐费用参考约¥134.33/月，图中沿用分享材料中个人估算的月度可用量区间3～5亿Token，两行对应同一套餐的不同估算摊销。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e套餐Token数量的估算来源：\u003c/strong\u003e根据同一统计周期内官方记录的已用Token，结合观察到的剩余额度比例，按已消耗比例外推套餐的等效可用量。例如，已用1亿Token、剩余额度90%，按已消耗10%估算，满额等效可用量约为10亿Token。\u003c/p\u003e\n\u003cp\u003e这种推算以Token统计与额度处于同一口径、额度消耗近似线性为前提，得到的是个人经验估算；实际已用量、估算可用量和官方固定额度分别说明。图中继续采用原材料的3～5亿区间，上述10亿只用于解释推算方法。\u003c/p\u003e\n\u003cp\u003eClaude Code 套餐月费参考：Pro ¥134.33，Max ¥671.65 或 ¥1,343.30。材料未给固定 Token 额度，保留月费参考。\u003c/p\u003e\n\u003cp\u003e资料价格日期为 2026-10-28，人民币换算采用材料中的参考汇率。以上展示不同使用方式的费用量级，模型、使用限制与 Token 结构存在差异；API 实际费用随输入输出和缓存比例变化。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. 把优化落实到实际消耗\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e重点观察一次任务使用了哪些模型、调用多少次、每次输入输出多少，以及缓存如何计费。调整后，用相同任务核对结果质量与模型费用，判断减少的消耗是否影响任务完成。\u003c/p\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 数据智能体：按工作流配置模型与推理参数\u003c/h4\u003e\n\u003cp\u003e数据智能体包含需求分析、报表设计、脚本生成等不同工作流，对模型能力的要求存在差异。\u003c/p\u003e\n\u003cp\u003e项目通过测试集比较不同 API 模型在各类 Skill 上的任务完成情况、响应耗时和模型费用，再为工作流配置对应模型。同时调整输入输出预算、思考模式和模型版本，使调用配置与任务需要相匹配。\u003c/p\u003e\n\u003cp\u003e模型或版本调整后，使用相同任务进行回归，检查结果质量与模型消耗的变化。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e体现的成本能力：\u003c/strong\u003e根据任务要求分配模型能力，减少超出任务需要的模型与推理投入。\u003c/p\u003e\n\u003ch4\u003eb. 保险知识问答：控制重复输入与输出长度\u003c/h4\u003e\n\u003cp\u003e在保险问答项目中，合并重复的角色说明和回答规则，精简 System Prompt，并让相同知识片段保持稳定的拼接方式，为前缀计算复用创造条件。\u003c/p\u003e\n\u003cp\u003e按照问题需要短答还是详细解释设置输出预算，结合实际输入、输出与缓存用量分析模型费用，同时核对必要条款和回答要求是否完整。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e体现的成本能力：\u003c/strong\u003e从输入组织、缓存复用和输出预算三个方面控制模型消耗。\u003c/p\u003e\n\u003ch4\u003ec. 营销助手：复用画像，减少重复模型调用\u003c/h4\u003e\n\u003cp\u003e营销助手包含画像生成与产品沟通内容生成等阶段。后续任务可以使用仍然有效的已有画像，结合当前候选产品资料生成对应内容，减少重复生成画像所需的模型调用。\u003c/p\u003e\n\u003cp\u003e各阶段按需要组织输入，控制无关标签、重复说明和过长输出；分别观察调用次数与每次 Token 用量，定位费用消耗较高的阶段。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e体现的成本能力：\u003c/strong\u003e通过结果复用和分阶段输入控制，减少重复调用与重复上下文带来的模型费用。\u003c/p\u003e"},{"id":"data-engineering","kind":"edge","title":"面向 AI 可用的数据治理","summary":"以 AI 可用为目标，用本体论指导业务语义、数据映射与使用约束的治理。","graph_label":"数据治理","nodes":["data","engineering"],"status":"practice","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003e已有数仓保存了表结构、字段和加工代码，但部分业务含义仍然分散在 SQL、文档和人员经验中。\u003c/p\u003e\n\u003cp\u003eAI 即使能够读取这些资料，也需要进一步判断：数据代表什么业务对象、指标如何定义、来源是否适用，以及使用时需要满足哪些条件。\u003c/p\u003e\n\u003cp\u003e因此，治理需要围绕“怎样让数据被 AI 理解并用于任务”明确补充内容和组织方式。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003eAI 可用是治理目标，本体论是治理方法，工程化负责落地。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. 以“AI 可用”确定治理目标\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003eAI 需要具备的能力\u003c/th\u003e\u003cth scope=\"col\"\u003e数据治理需要提供的内容\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e理解业务含义\u003c/td\u003e\u003ctd\u003e业务对象、字段含义、指标定义及相关说明\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e定位数据来源\u003c/td\u003e\u003ctd\u003e业务概念与表、字段、指标之间的对应关系\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e判断是否适用\u003c/td\u003e\u003ctd\u003e业务主题、粒度、统计口径、数据范围和使用条件\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e按规则使用数据\u003c/td\u003e\u003ctd\u003e指标计算依赖、维度转换依据，以及需要核验的条件\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e识别信息不足\u003c/td\u003e\u003ctd\u003e缺失信息、存在歧义的映射和需要业务确认的内容\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e2. 以本体论指导“治理什么、怎样关联”\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e先梳理业务中的对象、属性、关系和约束，再据此检查现有数仓资产，确定需要补齐、统一和核对的内容。\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e本体论指导项\u003c/th\u003e\u003cth scope=\"col\"\u003e对应的治理工作\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e对象\u003c/td\u003e\u003ctd\u003e明确业务主题、统计对象及模型表所表达的业务含义\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e属性\u003c/td\u003e\u003ctd\u003e补充对象的粒度、口径、范围，以及字段、指标的定义\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e关系\u003c/td\u003e\u003ctd\u003e建立业务概念与物理表字段、指标与基础字段、维度与字典之间的映射\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e约束\u003c/td\u003e\u003ctd\u003e明确数据适用条件、计算规则和关联要求，保留不同口径之间的区别\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e工程落地\u003c/td\u003e\u003ctd\u003e将确认后的定义和映射写入维护模板、结构化资料及查询工具，供实际开发使用\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e业务概念建模 → 明确映射与约束 → 补全和核对数仓资产 → 形成 AI 可读取、可查询的资料 → 在开发任务中验证可用性。\u003c/p\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 数据智能体：按统一业务模型治理表实体说明\u003c/h4\u003e\n\u003cp\u003e项目将元数据、既有 SQL 和开发人员的业务经验共同整理为表实体对象说明。\u003c/p\u003e\n\u003cp\u003e治理时明确模型表需要描述哪些属性，包括业务主题、指标分类、粒度、统计口径、数据范围和业务说明，再围绕这些要求补充缺失内容、核对解释依据。\u003c/p\u003e\n\u003cp\u003eAI 接收新需求后，可以按照相同的属性理解目标需求，筛选候选来源，再核验实际字段是否能够支撑任务。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e解决的痛点：\u003c/strong\u003e AI 能找到名称相近的表，却缺少判断业务适用性的依据；开发人员也需要反复读取 SQL 确认模型含义。\u003c/p\u003e\n\u003ch4\u003eb. 数据智能体：治理业务概念与字段、指标之间的映射\u003c/h4\u003e\n\u003cp\u003e项目整理标准字段、别名、字段标签和指标定义，将业务表达与实际数据结构建立对应关系。\u003c/p\u003e\n\u003cp\u003e治理重点包括：不同表达如何对应同一含义、不同业务口径如何区分、指标依赖哪些基础字段，以及哪些映射仍然需要确认。注释补全过程中保留来源，多种候选解释列为待确认项。\u003c/p\u003e\n\u003cp\u003e这些关系进入结构化资料后，AI 可以由需求中的业务概念查找定义和依赖，再核对真实字段。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e解决的痛点：\u003c/strong\u003e 业务语言与物理字段之间存在理解断层，AI 容易凭名称猜测，已有字典也难以表达完整的使用条件。\u003c/p\u003e\n\u003ch4\u003ec. 营销助手：将治理结果组织为 AI 可用的业务输入\u003c/h4\u003e\n\u003cp\u003e营销助手围绕客户组织标签、交易行为、走访记录和产品资料，明确不同信息的来源、业务角色与下游用途。\u003c/p\u003e\n\u003cp\u003e数据准备阶段处理批次、字段映射、去重和关联问题；进入模型时，区分原始事实、规则派生结果和模型推测，并为各阶段提供所需资料。\u003c/p\u003e\n\u003cp\u003e这个案例侧重体现“AI 可用”的落地：让输入具有明确的业务含义和使用边界，支持模型综合信息、形成画像和组织沟通内容。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e解决的痛点：\u003c/strong\u003e 原始资料虽然齐备，但信息分散、角色混杂，AI 难以判断哪些是事实、哪些可以作为推断依据。\u003c/p\u003e"},{"id":"data-architecture","kind":"edge","title":"数仓分层与主题建模","summary":"围绕业务主题与粒度，组织数仓分层、公共模型复用及应用供数。","graph_label":"数仓架构","nodes":["data","architecture"],"status":"practice","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003e业务数据分散在不同系统中，来源结构、统计粒度和业务口径各不相同。随着报表和分析需求增加，容易出现重复加工、指标定义不一致、模型相互耦合等问题。\u003c/p\u003e\n\u003cp\u003e数仓架构需要明确：数据如何接入、按什么业务过程组织、公共计算沉淀在哪里，以及如何稳定地向报表和应用供数。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e1. 从业务过程出发，划分主题与模型\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e先梳理业务过程、分析对象和指标，再确定模型的粒度、事实和维度。\u003c/p\u003e\n\u003cp\u003e例如订单、库存、财务可以分别形成主题模型，同时共享必要的组织、日期和业务对象维度，使跨主题分析具备一致的关联基础。\u003c/p\u003e\n\u003cp\u003e建模时先明确“一条记录代表什么”，再决定保留哪些明细、如何关联和在哪一层汇总，避免不同粒度混用造成重复统计。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. 通过数仓分层，明确各层职责\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e层次\u003c/th\u003e\u003cth scope=\"col\"\u003e主要职责\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eODS：原始数据层\u003c/td\u003e\u003ctd\u003e承接业务源数据，保留后续加工所需的原始信息\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDWD：明细数据层\u003c/td\u003e\u003ctd\u003e完成清洗、标准化和业务明细整合，明确事实记录的粒度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDIM：公共维度层\u003c/td\u003e\u003ctd\u003e统一日期、组织、产品等维度定义，为不同主题提供一致的分析依据\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDWS：主题服务层\u003c/td\u003e\u003ctd\u003e沉淀可复用的主题模型、公共指标和汇总结果\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eADS：应用数据层\u003c/td\u003e\u003ctd\u003e按报表、看板和接口需求组织数据，形成适合消费的数据集\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eDIM 为相关模型提供公共维度支持；实际加工链路根据业务需要组织，并非每个需求都必须经过所有层次。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. 将公共逻辑沉淀为可复用模型\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e把多个需求共同使用的明细、维度转换和指标计算放到合适的公共层维护，上层应用复用已有结果。\u003c/p\u003e\n\u003cp\u003e新增需求时，先判断现有模型能否支撑，再决定扩展公共模型或增加应用数据集。公共模型的粒度、口径和覆盖范围保持明确，减少每张报表各自重写一套业务逻辑的问题。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4. 结合处理与查询需求组织架构\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e根据数据更新周期安排全量、增量和历史补数，结合分区与任务依赖组织加工链路。\u003c/p\u003e\n\u003cp\u003e面向大批量加工和交互查询的不同要求，分别安排计算、存储与服务职责，通过应用数据集或查询服务向报表、看板和接口供数。\u003c/p\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 电池租赁数据平台：从业务主题搭建分层数仓\u003c/h4\u003e\n\u003cp\u003e围绕订单、资产库存和财务对账划分主题，将订单、押金、保险、服务、用户、门店及设备资产数据接入统一的数据链路。\u003c/p\u003e\n\u003cp\u003e主导 ODS—DWD—DWS—ADS 分层设计，在明细整合基础上建设订单宽表、资产库存和财务对账模型，再向运营看板与管理驾驶舱接口供数。\u003c/p\u003e\n\u003cp\u003e建设过程中采用“先满足关键报表，再逐步完善数仓模型”的推进方式，将需求中可复用的计算逐步沉淀为公共资产。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e体现的能力：\u003c/strong\u003e 根据业务阶段规划架构，将分散需求组织为可以持续扩展的主题数仓。\u003c/p\u003e\n\u003ch4\u003eb. 供应链数据中台：通过业务总线与一致性维度贯通分析\u003c/h4\u003e\n\u003cp\u003e围绕采购、生产、库存、配送和门店销售梳理业务总线，设计各业务过程对应的主题模型，并通过一致性维度统一跨环节分析口径。\u003c/p\u003e\n\u003cp\u003e使用 Hive 承担主题数据加工，结合 Doris 提供查询与数据服务，向供应链预警报表、经营分析和移动端看板供数。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e体现的能力：\u003c/strong\u003e 组织跨业务过程的数据关系，并根据加工与查询需求安排不同组件的职责。\u003c/p\u003e\n\u003ch4\u003ec. 保险报表开发：按粒度和计算职责拆分加工链路\u003c/h4\u003e\n\u003cp\u003e已有报表设计需要整合多个业务主题，各来源的明细粒度和统计条件存在差异。\u003c/p\u003e\n\u003cp\u003e设计中先分别组织来源数据，完成范围限定、基础字段提取和必要的维度补充；再按目标统计粒度完成指标计算，最后将结构与含义一致的结果合并为报表数据。\u003c/p\u003e\n\u003cp\u003e基础处理、指标计算和结果合并分别承担明确职责，使来源补充、口径调整和新增指标能够定位到具体加工环节。这些职责属于单个报表内部的链路设计，结合整体数仓分层使用。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e体现的能力：\u003c/strong\u003e 将复杂报表需求拆解为职责清楚、粒度明确的模型与加工链路。\u003c/p\u003e"},{"id":"data-algorithm","kind":"edge","title":"字段解析与处理方式选择","summary":"依据数据位置、字段结构与处理规模，选择引擎内计算、自定义程序或组合处理。","graph_label":"字段解析","nodes":["data","algorithm"],"status":"practice","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003e业务数据中的字段可能包含编码、组合文本、JSON、数组和多种格式的日期。解析时需要明确字段结构、类型、映射关系，以及缺失和异常数据的处理规则。\u003c/p\u003e\n\u003cp\u003e同一个任务可以通过数仓 SQL 完成，也可以编写专用程序处理。选型需要结合数据所在位置、解析复杂度、处理规模和下游用途。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e1. 对比引擎内处理与自定义程序处理\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e这里将“大数据方式”理解为 Hive、Spark SQL 等引擎内的批量处理，将“代码方式”理解为使用 Python 等语言编写专用解析程序。\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e对比项\u003c/th\u003e\u003cth scope=\"col\"\u003e大数据方式\u003c/th\u003e\u003cth scope=\"col\"\u003e代码方式\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e基本思路\u003c/td\u003e\u003ctd\u003e将解析表达为列转换、表关联和集合运算，由引擎批量执行\u003c/td\u003e\u003ctd\u003e将解析拆成函数和处理步骤，操作记录、字符串或嵌套对象\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e字段提取\u003c/td\u003e\u003ctd\u003e使用字符串、正则、JSON和数组等原生函数提取内容\u003c/td\u003e\u003ctd\u003e使用解析库、对象遍历和自定义规则提取内容\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e编码与含义映射\u003c/td\u003e\u003ctd\u003e通过字典表关联或条件表达式完成映射\u003c/td\u003e\u003ctd\u003e通过配置、字典和函数完成映射，可按来源分别组织规则\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e复杂分支\u003c/td\u003e\u003ctd\u003e可以分步骤建模，但大量条件和特殊格式会增加表达复杂度\u003c/td\u003e\u003ctd\u003e可以直接组织多步判断、格式适配与异常处理\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e关联与统计\u003c/td\u003e\u003ctd\u003e便于衔接大表关联、分组聚合和数仓加工\u003c/td\u003e\u003ctd\u003e可以完成关联与统计，需要结合内存、落盘和执行框架设计\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e结果用途\u003c/td\u003e\u003ctd\u003e适合形成可复用的明细表、主题模型和批量统计结果\u003c/td\u003e\u003ctd\u003e适合形成结构化对象、文件、接口输入和专用中间结果\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e例如，Spark SQL 原生支持 JSON 结构解析、正则提取和数组展开；实际可用能力应按项目引擎及版本核对。\u003ca href=\"https://spark.apache.org/docs/3.5.7/sql-ref-functions-builtin.html\"\u003eSpark SQL 官方函数文档\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. 根据任务条件选择处理方式\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e任务条件\u003c/th\u003e\u003cth scope=\"col\"\u003e优先考虑\u003c/th\u003e\u003cth scope=\"col\"\u003e选择依据\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e数据已经在数仓中，解析规则清晰，后续需要大量关联或聚合\u003c/td\u003e\u003ctd\u003e引擎内处理\u003c/td\u003e\u003ctd\u003e便于就地计算，减少数据导出和往返传输\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e输入主要是文件或接口结果，存在多种格式和逐条异常处理要求\u003c/td\u003e\u003ctd\u003e自定义程序\u003c/td\u003e\u003ctd\u003e便于贴近输入组织解析、校验和错误定位\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e字段结构复杂，原生函数难以清楚表达，或需要专用解析库\u003c/td\u003e\u003ctd\u003e自定义解析逻辑\u003c/td\u003e\u003ctd\u003e使规则可以独立维护、复用和验证\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e数据规模大，同时需要复杂解析\u003c/td\u003e\u003ctd\u003e分布式程序或引擎与程序协同\u003c/td\u003e\u003ctd\u003e同时满足解析能力和资源要求\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e不同环节分别适合不同方式\u003c/td\u003e\u003ctd\u003e分阶段组合\u003c/td\u003e\u003ctd\u003e将计算放在适合的位置，明确交接结构与责任\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e自定义程序也可以在 Spark 中分布式执行，例如通过 Pandas UDF 批量处理字段。因此，需要分别判断“解析逻辑如何表达”和“计算在哪里执行”。\u003ca href=\"https://spark.apache.org/docs/3.5.7/api/python/user_guide/sql/arrow_pandas.html\"\u003ePySpark 官方文档\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. 按数据依赖安排处理顺序\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e可以由数仓先过滤、提取必要字段，并完成适合提前执行的关联或聚合，再交给程序解析复杂内容；解析结果也可以回到数仓继续参与计算。\u003c/p\u003e\n\u003cp\u003e如果聚合会丢失后续解析需要的信息，就应先解析，再聚合。\u003c/p\u003e\n\u003cp\u003e选择前先核对两种实现对空值、类型、映射、数组展开和异常数据的处理是否一致，再比较代表性数据规模下的耗时、资源占用、数据搬移和维护成本。\u003c/p\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 营销标签：字段映射与码值解码\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e大数据方式：\u003c/strong\u003e 将字段与码值关系维护为映射表，通过表关联完成解码，适合数据已在数仓、需要批量统一处理的场景。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e代码方式：\u003c/strong\u003e 读取字段映射与码值配置，按来源表、字段和代码值查找含义；保留未命中的原始值，并记录异常。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e实际选择：\u003c/strong\u003e 当前营销链路在文件导出后使用程序处理，能够适配不同来源的字段结构、映射配置和输出要求。若同类规则需要成为多个下游共同使用的数据资产，可再评估将其沉淀到数仓公共处理环节。\u003c/p\u003e\n\u003ch4\u003eb. 营销流水：批量加工与复杂字段解析协同\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e大数据方式：\u003c/strong\u003e 对流水字段进行标准化、码值关联和按客户、月份的聚合，形成后续需要的行为特征与结构化字段。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e代码方式：\u003c/strong\u003e 对导出字段中的 JSON 内容进行解析，核对对象类型、空值和格式异常，再组织为下游能够直接使用的对象。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e实际选择：\u003c/strong\u003e 已有链路采用两者协同：SQL 承担批量加工，程序承担文件适配、结构解析和结果组装。程序侧结合流式读取、分块及落盘处理控制资源使用。\u003c/p\u003e\n\u003ch4\u003ec. 数据智能体：字段定义与别名解析\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e大数据方式：\u003c/strong\u003e 可以将字段定义、标准名称和别名作为关系表维护，通过 SQL 完成清洗、去重与关联，适合已经集中管理、需要批量对齐的元数据。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e代码方式：\u003c/strong\u003e 直接读取维护表格，处理空白、大小写和重复含义，将标准字段与别名整理为结构化映射，再生成查询所需的资料。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e实际选择：\u003c/strong\u003e 项目采用程序解析，因为输入是维护表格，输出是供查询工具和知识整理使用的结构化资产，程序能够直接连接输入与使用环节。\u003c/p\u003e"},{"id":"data-cost","kind":"edge","title":"大数据开发与复用成本","summary":"同时评估数据开发和后续复用投入，控制重复加工与长期维护成本。","graph_label":"开发复用","nodes":["data","cost"],"status":"design","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003e随着数据需求增加，同类来源查找、业务口径确认、指标计算和报表加工容易重复开展，持续消耗开发工时与计算资源。\u003c/p\u003e\n\u003cp\u003e已有模型虽然可以复用，使用时仍可能需要重新理解口径、补充关联、转换粒度和维护更新。因此，需要同时评估数据的开发投入，以及后续每次使用所需的投入。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e1. 数据开发成本：控制从需求到交付的投入\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e成本环节\u003c/th\u003e\u003cth scope=\"col\"\u003e主要投入\u003c/th\u003e\u003cth scope=\"col\"\u003e优化方向\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e需求与来源分析\u003c/td\u003e\u003ctd\u003e理解业务、确认口径、寻找来源和核对字段\u003c/td\u003e\u003ctd\u003e利用已有模型说明、指标定义与来源关系，明确实际缺口\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e建模与加工开发\u003c/td\u003e\u003ctd\u003e设计模型、编写清洗关联和指标计算逻辑\u003c/td\u003e\u003ctd\u003e复用适用的公共模型与加工规则，将新增开发集中在差异部分\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e验证与交付\u003c/td\u003e\u003ctd\u003e核对数据结果、排查问题、联调上下游\u003c/td\u003e\u003ctd\u003e前置确认粒度与口径，保留来源和计算依据，减少反复返工\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e加工与调试资源\u003c/td\u003e\u003ctd\u003e数据扫描、关联计算、中间结果存储和重复试跑\u003c/td\u003e\u003ctd\u003e限定必要字段与处理范围，结合分区、更新周期和任务依赖组织加工\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e开发时先判断已有资产能够承担多少需求，再确定需要新增的模型、字段和计算链路。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. 数据复用成本：降低后续使用的门槛与重复投入\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e复用成本包括找到、理解、适配和持续使用已有数据资产所需的投入。\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e复用环节\u003c/th\u003e\u003cth scope=\"col\"\u003e可能产生的成本\u003c/th\u003e\u003cth scope=\"col\"\u003e优化方向\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e定位与理解\u003c/td\u003e\u003ctd\u003e找不到合适的表，或需要反复读 SQL 判断含义\u003c/td\u003e\u003ctd\u003e明确模型主题、粒度、口径、范围和使用条件\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e接入与适配\u003c/td\u003e\u003ctd\u003e每次重新关联、转换字段、补充维度或调整统计粒度\u003c/td\u003e\u003ctd\u003e沉淀稳定的公共模型与一致性维度，明确上下游交接结构\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e读取与计算\u003c/td\u003e\u003ctd\u003e多个需求反复扫描相同数据、重复计算相同指标\u003c/td\u003e\u003ctd\u003e根据使用频率评估公共计算、预聚合和结果复用\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e更新与维护\u003c/td\u003e\u003ctd\u003e数据刷新、口径变化、历史补数和下游修改\u003c/td\u003e\u003ctd\u003e明确更新责任、依赖范围和结果失效条件，控制重复维护\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e公共模型和预计算结果也需要存储、更新与维护。需要将这些投入与它们能够减少的重复开发、重复计算一起比较。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. 根据使用频率和差异范围决定如何投入\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e先满足业务粒度、统计口径、数据范围和时效要求，再比较不同方式：\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003e已有模型能够直接支撑需求：\u003c/strong\u003e 优先复用，评估读取和接入成本。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e已有模型只存在局部缺口：\u003c/strong\u003e 比较补充字段、增加关联或扩展计算的投入。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e多个需求持续使用相同逻辑：\u003c/strong\u003e 评估沉淀公共模型或公共指标，分摊后续开发与计算投入。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e一次性探索或尚不稳定的需求：\u003c/strong\u003e 控制初期建设范围，按实际使用情况决定是否长期维护。\u003c/li\u003e\u003c/ul\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 数据研发：先确认已有来源，再决定新增加工范围\u003c/h4\u003e\n\u003cp\u003e新报表需求先按业务主题、粒度、口径和范围查找候选模型，再核对维度、指标及计算依赖的覆盖情况。\u003c/p\u003e\n\u003cp\u003e在此基础上，确定哪些内容可以直接使用，哪些需要补充来源、转换粒度或新增计算，并形成明确的设计输入。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e开发成本：\u003c/strong\u003e 将新增开发集中在实际缺口，减少重复追溯来源和重建已有逻辑。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e复用成本：\u003c/strong\u003e 保留模型说明与覆盖依据，帮助后续需求判断适用性；同时将知识更新和来源变化纳入维护。\u003c/p\u003e\n\u003ch4\u003eb. 营销数据准备：在中断恢复时复用已完成阶段\u003c/h4\u003e\n\u003cp\u003e数据准备程序按阶段组织读取、关联和加工，记录处理状态，并结合输入文件标识、配置及流程版本判断续跑条件。\u003c/p\u003e\n\u003cp\u003e任务中断后，在条件满足时复用已完成阶段的处理结果，继续完成剩余工作；条件变化时重新处理对应阶段。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e开发成本：\u003c/strong\u003e 按阶段组织处理逻辑，便于定位问题和调整局部规则。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e复用成本：\u003c/strong\u003e 减少恢复任务时重复读取、关联和加工的投入，同时考虑中间结果的存储、保留与清理成本。\u003c/p\u003e"},{"id":"engineering-architecture","kind":"edge","title":"三层开发架构：逻辑、业务与技术","summary":"以本地完整逻辑与详细路由为依据，逐层映射业务流程和实际技术节点，验证结果并完成环境适配与优化。","graph_label":"开发架构","nodes":["engineering","architecture"],"status":"practice","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003e从本地验证走向实际业务使用，需要逐步落实完整的业务流程、结果质量和技术运行条件。\u003c/p\u003e\n\u003cp\u003e如果详细路由、业务规则与技术实现缺少对应关系，迭代时就容易出现流程遗漏、节点职责变化和不同环境下结果不一致的问题。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e我使用这套三层开发框架组织项目，并根据具体业务、权限、平台和交付条件调整各层的工作安排与实现方式。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. 第一层：PoC / Demo 与完整逻辑层\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e主要在本地电脑上开展可行性验证与开发，便于快速调整逻辑、验证算法和检查流程。\u003c/p\u003e\n\u003cp\u003e这一层持续维护最完整的逻辑和详细路由图，包括：\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e任务入口、执行顺序、节点依赖与输入输出。\u003c/li\u003e\u003cli\u003e判断条件、分支、循环、异常路径和结束条件。\u003c/li\u003e\u003cli\u003eAI、程序与人员分别承担的工作，以及人工确认位置。\u003c/li\u003e\u003cli\u003e节点使用的数据、知识和代码依据。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e后续业务流程与技术实现都能够回到这份路由中找到对应位置。开发中形成的判断和修改，也持续记录在这一层。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. 第二层：业务流程映射与质量验证层\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e从第一层提取并展开业务逻辑，将每个节点需要完成的业务内容梳理完整。\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e业务内容\u003c/th\u003e\u003cth scope=\"col\"\u003e需要明确的事项\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eRAG 与知识库\u003c/td\u003e\u003ctd\u003e需要哪些知识、如何组织与检索、检索结果供哪个节点使用、缺失或不适用时如何处理\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAI 相关算法\u003c/td\u003e\u003ctd\u003eAI 承担什么任务，使用哪些输入、知识和工具，输出如何校验，判断失败后如何继续\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e人机交互\u003c/td\u003e\u003ctd\u003e用户如何输入、确认、修改和查看结果，哪些情况需要人员判断或接管\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e业务规则与交接\u003c/td\u003e\u003ctd\u003e数据含义、使用条件、阶段输出、继续条件，以及异常返回路径\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e这一层重点确保流程结果的\u003cstrong\u003e稳定性和准确性\u003c/strong\u003e：\u003c/p\u003e\n\u003cp\u003e稳定性关注流程能否按约定推进、阶段结果能否可靠交接、异常是否有明确处理方式；准确性关注知识依据、数据事实、算法判断和最终业务结果是否符合要求。\u003c/p\u003e\n\u003cp\u003e验证覆盖正常流程、边界情况、缺失信息和异常分支，形成能够重复核对的业务样例与验收条件。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. 第三层：技术节点映射与实际环境优化层\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e从第二层进一步明确每个业务节点的具体实现，结合实际环境、数据权限和平台能力完成落地。\u003c/p\u003e\n\u003cp\u003e例如，第二层暂时使用 TXT 或表格组织数据，第三层就需要明确：\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e数据如何对应到数据库中的表、字段和关联关系。\u003c/li\u003e\u003cli\u003e实际允许访问哪些数据，具备哪些读写权限。\u003c/li\u003e\u003cli\u003e通过什么接口读取、更新和交接结果。\u003c/li\u003e\u003cli\u003e如何保持迁移前后的数据含义、业务规则和输出要求一致。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e同时，针对查询、计算、传输、并发和资源使用中的实际瓶颈进行优化。技术实现调整后，再回到第二层核对业务结果。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4. 维护三层之间的对应关系\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e第一层逻辑节点\u003c/th\u003e\u003cth scope=\"col\"\u003e第二层业务映射\u003c/th\u003e\u003cth scope=\"col\"\u003e第三层技术映射\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e获取资料\u003c/td\u003e\u003ctd\u003e明确资料范围、知识检索与适用条件\u003c/td\u003e\u003ctd\u003e文件读取、知识检索服务、数据库查询或授权接口\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAI 处理\u003c/td\u003e\u003ctd\u003e明确算法职责、输入输出、业务约束与校验方式\u003c/td\u003e\u003ctd\u003e模型接口、执行代码、配置和调用控制\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e人工确认\u003c/td\u003e\u003ctd\u003e明确谁确认、确认什么，以及修改或拒绝后的去向\u003c/td\u003e\u003ctd\u003e交互页面、状态保存与相应操作权限\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e保存结果\u003c/td\u003e\u003ctd\u003e明确结果含义、使用对象和更新规则\u003c/td\u003e\u003ctd\u003e数据库写入、文件输出及下游访问接口\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e业务分支发生变化时，同步修订第一层的详细路由；技术节点发生替换时，核对第二层的业务要求。三层保留节点对应关系，使问题和变更能够追溯。\u003c/p\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 数据智能体：贯通逻辑、业务与技术的开发架构\u003c/h4\u003e\n\u003cp\u003e数据智能体是这套开发架构中最成熟的主要实践。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第一层：本地维护完整逻辑与详细路由。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e围绕需求解析、知识检索、来源筛选、字段验证、模型设计、脚本生成和 Review，维护完整开发路线。明确 AI、程序工具与工程师的职责，记录节点输入输出、分支条件、人工确认和异常返回路径，并在本地快速验证和迭代。\u003c/p\u003e\n\u003cp\u003e这一层持续保存主要开发逻辑，为后续业务映射和技术实现提供依据。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第二层：将开发路由映射为完整业务流程。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e围绕业务需求，梳理指标知识、表实体说明、字段字典、业务口径和开发规范如何进入检索与使用流程；明确规则匹配、语义判断、字段核验、代码生成与检查分别承担什么任务。\u003c/p\u003e\n\u003cp\u003e同时，组织需求确认、分析结果确认、设计审阅和交付检查等人机交互，逐段核对知识依据、数据事实与业务结论，保障流程结果的稳定性和准确性。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第三层：将业务节点落实到实际技术环境。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e按照实际权限和运行条件，将知识检索、元数据查询、工具执行、状态保存和交付等业务节点，对应到具体数据库、服务接口与运行组件。\u003c/p\u003e\n\u003cp\u003e需要入库的数据，按业务含义、结构和访问要求完成映射；开发执行与生产发布按既定权限和人员职责衔接，并围绕数据加载、查询、执行和持久化中的实际瓶颈优化。\u003c/p\u003e\n\u003ch4\u003eb. 营销助手：从本地文件流程映射到数据与服务链路\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e第一层：\u003c/strong\u003e 在本地用文件和脚本验证数据准备、画像生成、内容生成与结果保存的完整流程，维护阶段依赖、分支和失败路径。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第二层：\u003c/strong\u003e 梳理客户资料、产品资料和业务规则如何参与各阶段，区分程序计算与模型判断，明确请求发起、结果返回及异常处理，并验证阶段结果是否满足业务要求。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第三层：\u003c/strong\u003e 将文件输出映射到入库结构、查询接口和结果写入节点，依据实际权限接入目标环境，再围绕数据读取、关联及服务调用进行优化。\u003c/p\u003e\n\u003ch4\u003ec. 卡片脚手架：从详细路由映射到平台执行节点\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e第一层：\u003c/strong\u003e 在本地持续维护业务主线与详细路由，记录节点、条件、数据交接和用户状态，作为后续设计与修改的共同依据。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第二层：\u003c/strong\u003e 将用户输入、确认、提示、结果展示和业务判断梳理完整，明确正常流转、缺项补充与异常返回，核对交互过程和业务结果。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第三层：\u003c/strong\u003e 将业务节点映射为平台支持的流程节点、卡片组件、变量、事件和接口配置，对照实际平台能力完成适配，并在平台中验证流程与交互结果。\u003c/p\u003e"},{"id":"engineering-algorithm","kind":"edge","title":"算法拆分与工程化落地","summary":"根据架构和功能拆分完整算法流程，从可行性验证推进到输入输出稳定、功能解耦和可靠运行。","graph_label":"算法落地","nodes":["engineering","algorithm"],"status":"practice","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003e一套完整流程通常包含数据准备、规则处理、特征计算、检索、模型推理和结果加工等多个环节。\u003c/p\u003e\n\u003cp\u003ePoC / Demo 阶段主要验证算法能否实现目标。进入实际业务后，还需要考虑功能之间的依赖、输入输出的稳定性、异常处理和持续迭代，使算法能够长期可靠地参与业务流程。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e1. 根据架构与功能，拆分完整算法流程\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e沿完整路由识别算法节点，结合业务职责、数据依赖和运行方式划分模块：\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003e数据适配\u003c/strong\u003e：组织输入数据，完成必要的格式转换与字段校验。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e算法处理\u003c/strong\u003e：分别承担规则判断、特征计算、检索排序、模型推理等功能。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e流程编排\u003c/strong\u003e：管理执行顺序、阶段依赖、分支条件和继续执行的条件。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e结果校验与交付\u003c/strong\u003e：核对输出是否符合要求，再交给下游使用或保存。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e每个模块明确输入、输出、依赖和失败状态。算法逻辑与数据读取、模型调用适配、结果保存等技术实现分别维护，便于独立调整、定位和替换。\u003c/p\u003e\n\u003cp\u003e模块可以在同一进程内组织，也可以根据架构需要独立运行。拆分粒度同时考虑交接复杂度、调用开销和维护成本。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. 从“验证能实现”扩展到“持续满足工程要求”\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e对比项\u003c/th\u003e\u003cth scope=\"col\"\u003ePoC / Demo 阶段\u003c/th\u003e\u003cth scope=\"col\"\u003e工程化落地阶段\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e验证目标\u003c/td\u003e\u003ctd\u003e代表性输入下能否得到目标结果\u003c/td\u003e\u003ctd\u003e在约定输入范围、异常情况和运行负载下持续满足要求\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e功能组织\u003c/td\u003e\u003ctd\u003e便于快速试验和观察完整算法路线\u003c/td\u003e\u003ctd\u003e按职责与依赖拆分，支持局部修改和替换\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e输入输出\u003c/td\u003e\u003ctd\u003e围绕验证样例组织数据和结果\u003c/td\u003e\u003ctd\u003e明确结构、类型、业务含义、空值与异常状态\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e稳定性\u003c/td\u003e\u003ctd\u003e优先验证核心路径\u003c/td\u003e\u003ctd\u003e补齐边界条件、超时控制、失败处理和恢复机制\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e效果判断\u003c/td\u003e\u003ctd\u003e检查核心算法结果\u003c/td\u003e\u003ctd\u003e同时核对模块结果与完整流程，观察时延和资源投入\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003ePoC 阶段形成的完整逻辑、业务规则和验证样例继续保留，作为工程化拆分与后续回归的依据。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. 将稳定性落实到具体算法节点\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003e输入与输出约定\u003c/strong\u003e：区分正常结果、空结果、无法判断和执行失败，明确哪些结果允许继续传递。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e运行边界\u003c/strong\u003e：根据场景约束输入规模、候选范围、调用次数、执行时间和并发资源。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e失败处理\u003c/strong\u003e：区分输入不适用、算法无法判断和临时调用失败，分别安排补充信息、人工确认、有限重试或终止。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e可追溯与变更验证\u003c/strong\u003e：保留必要的中间结果、运行状态和版本依据；模块调整后，既验证局部功能，也核对完整业务链路。\u003c/li\u003e\u003c/ul\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 数据智能体：拆分字段匹配、语义判断与覆盖统计\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e算法拆分\u003c/strong\u003e：将字段覆盖流程组织为常规预匹配、模型语义补充、真实字段复核和覆盖统计等环节。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e工程处理\u003c/strong\u003e：程序承担字典匹配、字段事实查询与统计，模型承担表达差异的语义判断，工作流负责候选范围和中间结果的交接。各环节可以分别调整和检查。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e稳定性重点\u003c/strong\u003e：候选范围与待验证字段在各环节保持一致；程序核对字段真实存在，工程师另行确认业务语义、低置信度映射与可计算指标的覆盖口径。不确定项保留为未匹配或待确认，确认后的结果再用于后续设计。\u003c/p\u003e\n\u003ch4\u003eb. 营销助手：将画像与内容生成拆成有依赖关系的算法阶段\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e算法拆分\u003c/strong\u003e：将规则派生、行为特征计算、信息抽象、画像融合和沟通内容生成分别组织，明确确定性计算与模型判断的职责。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e工程处理\u003c/strong\u003e：算法阶段与数据查询、模型调用适配、结果写入分别组织，使画像逻辑和生成策略能够局部调整，并通过阶段状态衔接后续处理。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e稳定性重点\u003c/strong\u003e：实时链路对前置输出进行结构与有效性检查，前置失败时阻断依赖阶段；同时设置执行时间和请求预算，记录失败位置，控制异常对整条流程的影响。\u003c/p\u003e\n\u003ch4\u003ec. 保险知识问答：将召回、重排和生成分开优化\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e算法拆分\u003c/strong\u003e：在参与的保险知识问答链路中，将关键词与语义召回、候选合并去重、重排、父块回溯、上下文组织和回答生成分为不同处理环节。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e工程处理\u003c/strong\u003e：分别组织候选结果、排序结果和最终上下文，使检索策略、重排策略及生成配置能够独立分析和调整，同时保持前后交接稳定。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e稳定性重点\u003c/strong\u003e：记录各环节的中间结果，定位偏差首次出现的位置；调整某一环节后，使用相同问题继续核对知识召回、最终回答和链路表现，并结合上下文与输出范围控制运行投入。\u003c/p\u003e"},{"id":"engineering-cost","kind":"edge","title":"工程开发与维护升级成本","summary":"通过分阶段建设、能力复用和变更管理，控制首次交付及后续排障、交接、升级的总投入。","graph_label":"开发维护","nodes":["engineering","cost"],"status":"record","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003e工程的成本贯穿开发、使用和升级全过程。\u003c/p\u003e\n\u003cp\u003e首次开发需要完成需求理解、可行性验证、功能实现、联调与交付。投入使用后，还会持续遇到业务规则变化、异常排查、人员交接，以及模型、接口和运行环境升级。\u003c/p\u003e\n\u003cp\u003e如果流程、职责和依赖关系不清晰，一次局部变化就可能带来大范围修改、重复理解和反复验证，使后续成本不断累积。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e1. 开发成本：按阶段投入，减少重复建设与返工\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003e先验证关键路径\u003c/strong\u003e：在 PoC / Demo 阶段确认核心逻辑能否实现，保留完整路由、业务规则和验证样例，再逐步补齐工程要求。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e复用已有能力\u003c/strong\u003e：明确通用工具、工作流、组件和项目配置的边界，将新增开发集中在实际差异上。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e前置确认交接要求\u003c/strong\u003e：提前明确输入输出、依赖、职责和验收条件，减少联调时才发现理解不一致的返工。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e控制建设范围\u003c/strong\u003e：根据实际使用需求安排开发深度，评估每个新增模块及机制需要承担的长期维护工作。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e2. 维护与升级成本：让问题容易定位，让变化范围可控\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e成本环节\u003c/th\u003e\u003cth scope=\"col\"\u003e容易产生的投入\u003c/th\u003e\u003cth scope=\"col\"\u003e工程处理方向\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e故障定位与修复\u003c/td\u003e\u003ctd\u003e反复阅读完整代码、重现问题、逐步排查\u003c/td\u003e\u003ctd\u003e保留阶段状态、必要中间结果和错误位置，明确模块职责\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e业务规则调整\u003c/td\u003e\u003ctd\u003e多处重复修改、遗漏同步、影响既有功能\u003c/td\u003e\u003ctd\u003e分别维护业务规则、知识内容和技术实现，检查依赖与影响范围\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e模型、接口与依赖升级\u003c/td\u003e\u003ctd\u003e参数适配、输出变化、兼容性修正与重新联调\u003c/td\u003e\u003ctd\u003e明确调用边界与输出要求，核对兼容性，并进行局部和完整流程验证\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e人员交接与持续维护\u003c/td\u003e\u003ctd\u003e依赖原开发者解释流程、环境和历史决策\u003c/td\u003e\u003ctd\u003e持续维护路由、接口说明、运行前提及必要变更记录\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e3. 将首次投入与后续投入一起评估\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e评价一种工程方案时，同时考虑：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e首次开发投入＋持续维护投入＋后续升级投入。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e对于长期使用、频繁变化或多人协作的能力，可以增加通用模块、检查和文档投入；对于一次性验证、需求尚未稳定的部分，先保留清晰逻辑与必要边界，再按实际需要扩展。\u003c/p\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 数据智能体：将开发经验沉淀为可以持续维护的工作流\u003c/h4\u003e\n\u003cp\u003e将需求分析、来源识别、字段验证、脚本生成和 Review 等过程组织为 Skill，并将使用中反复出现的问题继续沉淀为规则和检查要求。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e开发成本：\u003c/strong\u003e 后续同类任务能够沿已有流程推进，复用业务经验、查询能力和交付要求，减少每次重新解释任务、组织步骤和补充规范的工作。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e维护升级成本：\u003c/strong\u003e 根据反馈定位需要调整的流程或规则，修正后继续通过既有任务核对结果。将一次问题的处理沉淀为后续可用的约束，同时保留规则更新与验证所需的投入。\u003c/p\u003e\n\u003ch4\u003eb. 营销助手：通过阶段划分控制开发与变更范围\u003c/h4\u003e\n\u003cp\u003e将数据查询、画像处理、沟通内容生成、模型调用适配和结果保存分别组织，并记录阶段状态、错误位置及处理耗时。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e开发成本：\u003c/strong\u003e 各部分围绕明确的交接要求实现和联调，便于分别开发、检查和调整，减少不同职责混在一起产生的修改工作。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e维护升级成本：\u003c/strong\u003e 调整画像逻辑、生成要求或模型调用时，先定位对应模块，再检查前置依赖、输出结构及下游使用情况。阶段状态帮助缩小排查范围，局部验证与完整流程回归共同控制升级影响。\u003c/p\u003e\n\u003ch4\u003ec. 卡片脚手架：复用搭建资产，限制局部修改的影响\u003c/h4\u003e\n\u003cp\u003e工程中分别维护通用模板、素材与项目风格；已有卡片的提示调整，则围绕对应内容与显示条件修改，保留原有变量、事件和接口交接关系。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e开发成本：\u003c/strong\u003e 新任务可以复用适用的结构、设计资源和搭建规则，将工作集中在业务差异与必要适配上。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e维护升级成本：\u003c/strong\u003e 局部反馈对应局部改动，通过原件对照和差异记录检查影响范围，减少重新搭建与无关修改带来的回归工作；平台交互效果仍需单独验证。\u003c/p\u003e"},{"id":"architecture-algorithm","kind":"edge","title":"整体设计与AI分工下的算法协同","summary":"分别判断整体设计是否完整、任务由谁组织推进，以及AI承担技术节点还是任务处理，明确算法依赖与自主范围。","graph_label":"算法协同","nodes":["architecture","algorithm"],"status":"design","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003e单个算法可以完成匹配、计算、检索或生成，但完整业务还需要明确：这些能力如何连接、依据什么做判断、由谁决定下一步，以及哪些结果需要确认。\u003c/p\u003e\n\u003cp\u003e缺少整体设计时，算法容易成为分散的功能。具备完整设计后，任务可以由人员和预设程序推进，也可以在明确边界内由AI主导组织。AI既可以增强具体技术节点，也可以承担部分原先由人员完成的分析、判断和实现工作。\u003c/p\u003e\n\u003cp\u003e因此，架构既影响算法之间的协作，也影响任务实现路径由谁决定、何时形成。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e1. 先判断整体设计是否完整\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e这里的“无架构”指缺少明确的整体设计，作为模拟对照。完整设计需要明确算法职责、数据依赖、交接结构、异常处理和结果使用条件，为各类任务组织方式提供基础。\u003c/p\u003e\n\u003cp\u003e是否引入AI，与设计是否完整分别判断。使用模型仍需要清晰的职责、依赖与检查要求；预设流程也可以具备完整的架构。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. 再比较任务由谁组织、实现路径如何形成\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e在整体设计明确的前提下，对比任务的组织与推进方式：\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e对比维度\u003c/th\u003e\u003cth scope=\"col\"\u003e人员推进或程序预设编排\u003c/th\u003e\u003cth scope=\"col\"\u003eAI主导任务组织\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e任务推进\u003c/td\u003e\u003ctd\u003e人员串联分析与交接，或程序按已定义顺序执行\u003c/td\u003e\u003ctd\u003eAI依据目标、Skill和阶段结果组织任务，在关键节点提交确认\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e实现路径\u003c/td\u003e\u003ctd\u003e人员选择方法，或在开发阶段写入规则、分支与调用方式\u003c/td\u003e\u003ctd\u003e主流程与边界保持明确，部分配置、代码和工具衔接由AI根据当前任务形成\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e业务经验\u003c/td\u003e\u003ctd\u003e由人员掌握，或转为程序规则与配置\u003c/td\u003e\u003ctd\u003e进一步组织为知识库、Skill与检查要求，供AI理解和使用\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e新情况处理\u003c/td\u003e\u003ctd\u003e超出预设范围时，由人员补充判断或扩展流程\u003c/td\u003e\u003ctd\u003eAI在已有知识与工具范围内组织处理方式，存在歧义时提交确认\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e结果控制\u003c/td\u003e\u003ctd\u003e按任务要求核对结构、事实、业务含义与运行结果\u003c/td\u003e\u003ctd\u003e在同样的检查要求下，补充AI决策边界、工具权限和阶段反馈\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e不同环节可以组合这些方式，例如主流程由程序编排，其中一个复杂任务由AI组织实现。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. 区分AI的两种算法职责，并确定自主范围\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003eAI 作为技术节点\u003c/strong\u003e：承担语义匹配、信息抽象、分类或内容生成。整体流程、调用顺序和阶段依赖仍由程序安排。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eAI 作为任务处理节点\u003c/strong\u003e：依据目标、知识与工具，承担部分业务理解和实现工作，自主选择具体配置、组织代码、调用工具，并根据结果继续调整。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e当 AI 主导任务推进时，人员负责目标、边界、关键确认与验收，程序工具负责事实查询、确定性计算、校验和实际执行。\u003c/p\u003e\n\u003cp\u003e架构设计需要明确哪些步骤固定执行，哪些判断交给 AI，哪些结果必须由人员确认。\u003c/p\u003e\n\u003cp\u003e规则明确、要求一致执行的部分，可以采用预设流程；需要理解变化表达、综合资料或组织实现方案的部分，可以引入 AI。AI 的自主范围与可用知识、工具权限、结果可验证性及失败影响相匹配。\u003c/p\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003cp\u003e三个示例先用缺少整体设计的模拟说明问题，再比较有整体设计时的任务组织和AI职责，分别突出开发任务推进、实现路径选择，以及预设流程中的AI技术节点。\u003c/p\u003e\n\u003ch4\u003ea. 数据智能体：从功能拼接，到预设流程，再到 AI 主导开发任务\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e缺少整体设计（模拟）：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e拿到报表需求后直接搜索字段、选择匹配较多的表并生成脚本。匹配、选表和生成各自能够运行，但业务口径、粒度、来源适用性与检查顺序没有形成完整约束，局部匹配正确仍可能得到不适用的加工方案。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e有整体设计：工程师推进（对照）\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e工程师理解需求、查询资料、确认来源和口径，再组织字段核对、加工设计、编码与检查。程序承担已实现的查询和计算，分析与跨阶段推进主要由工程师完成。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e有整体设计：AI主导开发任务\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e将业务经验、知识、元数据工具和开发规则组织为 AI 可用的能力。AI 按 Skill 主导需求分析、资料查询、字段核对、设计与脚本生成，在关键节点形成材料交工程师确认；程序承担真实字段查询、覆盖统计和确定性检查。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e体现的影响：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e架构先让匹配、设计和生成围绕同一业务目标协作，再将部分原先依赖工程师持续组织的工作交给 AI。AI 的作用扩展到分析、材料形成和阶段推进。\u003c/p\u003e\n\u003ch4\u003eb. 卡片脚手架：从局部配置修改，到人工设计，再到 AI 选择实现路径\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e缺少整体设计（模拟）：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e收到提示行为调整需求后，直接修改组件或增加变量，没有先检查原有状态、事件和数据交接。局部显示可能满足要求，却可能与原有流程状态或后续交互产生冲突。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e有整体设计：开发人员选择实现方式（对照）\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e开发人员读取现有配置，分析变量和事件，决定是否增加状态、怎样设置条件，再修改对应内容并检查影响范围。具体实现方案由开发人员选择。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e有整体设计：AI组织具体实现\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAI 结合 Skill、平台规则和已有配置理解目标，检查原有变量与事件，判断能否复用已有状态，再组织显示条件与配置改动。关键方案和修改边界由人员确认，生成后对照原件核查，实际交互由平台验证。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e体现的影响：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e架构为 AI 提供了任务目标、可用能力和修改边界，使其能够承担部分实现方案选择，而不必由人员提前写出每一种交互改造方式。已有案例体现了配置修改与静态对照，平台交互效果仍需单独验证。\u003c/p\u003e\n\u003ch4\u003ec. 营销助手：从重复处理，到固定规则，再到分阶段的 AI 信息综合\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e缺少整体设计（模拟）：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e不同内容任务各自读取客户资料、计算特征、生成画像，再形成沟通内容。公共输入和画像缺少统一组织，可能重复处理，也可能让不同任务依据不同的客户理解。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e有整体设计：程序预设编排与固定规则（对照）\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e程序统一加工规则标签和行为特征，按预设顺序衔接画像与内容输出。采用固定模板时，需要提前规定信息组合与表达方式，未覆盖的组合由人员补充理解和整理。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e有整体设计：预设流程结合AI技术节点\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e程序继续组织数据准备、阶段依赖和结果交接；AI 分别承担信息抽象、画像融合和沟通内容生成。同一次请求中的公共画像供后续内容任务使用，产品候选及顺序来自上游。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e体现的影响：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e架构明确了确定性计算、共享画像和内容生成之间的关系，AI 补充多源信息理解与表达能力。这里的 AI 主要承担预设流程中的技术节点，尚不能据此表述为自主调度整条业务链路。\u003c/p\u003e"},{"id":"architecture-cost","kind":"edge","title":"架构选择与成本结构","summary":"通过公共能力、计算时点与能力承载方式的取舍，比较固定投入、持续消耗和扩展投入，判断成本随使用范围扩大的变化。","graph_label":"成本结构","nodes":["architecture","cost"],"status":"design","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003e实现相同的业务目标，不同架构会产生不同的成本结构。\u003c/p\u003e\n\u003cp\u003e每个场景分别建设能力，会增加重复投入；集中建设公共能力，需要承担统一管理和兼容工作；提前计算可以减少请求时的处理，也会产生存储、更新及未被使用的计算投入。\u003c/p\u003e\n\u003cp\u003e因此，架构设计需要同时考虑成本出现在哪里、由多少场景共同承担，以及使用范围扩大后还需要增加什么。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e1. 从系统组织方式判断成本如何产生\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e架构选择\u003c/th\u003e\u003cth scope=\"col\"\u003e对成本结构的影响\u003c/th\u003e\u003cth scope=\"col\"\u003e需要比较的取舍\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e公共底座与场景独立建设\u003c/td\u003e\u003ctd\u003e改变公共能力的建设次数，以及新增场景的接入投入\u003c/td\u003e\u003ctd\u003e共享能够减少哪些重复建设，同时增加多少统一管理、适配与兼容工作\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e批量准备与实时按需处理\u003c/td\u003e\u003ctd\u003e改变计算发生的时间、重复次数，以及结果保存方式\u003c/td\u003e\u003ctd\u003e使用频率、数据时效、计算投入、存储和更新成本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e平台原生能力与独立扩展\u003c/td\u003e\u003ctd\u003e改变需要自行承担的组件、接口和运行依赖\u003c/td\u003e\u003ctd\u003e现有能力是否满足要求，新增扩展的收益能否覆盖接入与长期支持投入\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e2. 将固定投入、持续消耗和扩展投入一起比较\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003e固定投入\u003c/strong\u003e：公共底座、知识组织、接口和基础运行能力的建设。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e持续消耗\u003c/strong\u003e：每次任务产生的查询、计算、模型调用、传输及存储更新。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e扩展投入\u003c/strong\u003e：增加一个场景、一类数据或一个使用入口时，需要新增和调整的部分。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e比较时统一业务范围、结果质量、时效和权限条件，再结合使用频率、场景数量及变化程度判断方案。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. 根据实际规模安排架构演进\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e使用范围较小时，先满足核心需求，控制公共能力和独立组件的建设范围。\u003c/p\u003e\n\u003cp\u003e当多个场景持续使用相同能力，或重复计算开始成为主要消耗时，再评估共享、预计算或独立服务。每次增加架构能力，都同时明确它减少的投入与新增的负担。\u003c/p\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 数据智能体：公共底座如何改变新增场景的成本\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e具体做法：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e业务知识、元数据查询和开发工具形成公共能力，不同 Skill 分别组织报表分析、设计、生成、字段扩展及迁移等任务。新增场景可以承接已有知识与工具，再补充对应流程和规则。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e成本结构上的影响：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e公共知识和工具的建设投入可以由多个场景共同承担。新增场景的工作集中在差异流程、必要工具和验证上，同时需要持续维护公共知识及接口的适用性。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e需要作出的判断：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e识别哪些能力具有稳定的共同需求，哪些内容应保留在具体场景中，避免公共底座承担过多差异逻辑。\u003c/p\u003e\n\u003ch4\u003eb. 营销助手：批量与实时分工如何改变重复消耗\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e具体做法：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e客户资料和行为特征先完成准备，实时请求再组织画像与沟通内容生成；在适用条件下，也可以使用已有批量画像，继续处理当前内容任务。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e成本结构上的影响：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e部分工作从请求发生时的重复处理，转为前置计算、结果保存和更新。在线任务能够复用已有结果，同时需要承担准备、存储及失效管理的投入。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e需要作出的判断：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e结合实际使用次数和时效要求，确定哪些内容值得提前准备、哪些应按需生成。频繁使用的公共内容与低频变化需求，可以采用不同的处理安排。\u003c/p\u003e\n\u003ch4\u003ec. 卡片脚手架：能力由哪一层承担，会产生不同的系统负担\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e具体做法：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e设计规则先检查直接绑定和平台原生转换能否完成任务；确定性处理按实际可用的平台能力组织，需要语义理解时引入模型，已有能力存在明确缺口时再评估扩展。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e成本结构上的影响：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e能力放在平台、程序、模型或独立扩展中，会产生不同的调用、接入和运行依赖。增加独立组件，也会增加接口衔接、部署适配和版本兼容等工作。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e需要作出的判断：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e先核对功能、权限和运行条件，再比较不同承载方式的完整投入，让新增组件对应明确的能力收益。\u003c/p\u003e"},{"id":"algorithm-cost","kind":"edge","title":"AI算法的运行成本与时间优化","summary":"以可用结果为目标，同时评估模型消耗、运行资源、处理时间、批量能力和失败返工，依据实际瓶颈优化。","graph_label":"效能优化","nodes":["algorithm","cost"],"status":"record","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003eAI算法的成本包含模型调用、程序计算和数据处理，也包含等待时间、失败重试与人工修正。\u003c/p\u003e\n\u003cp\u003e单次调用较快，可能伴随内容缺失或结果不可用；增加并发，可能受到共享资源和排队影响；减少输入或输出，也可能损失必要信息。因此，需要在结果质量满足要求的前提下，评估完整任务的资源消耗、处理时间和完成能力。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e1. 围绕可用结果，拆开观察成本与效率\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e评估维度\u003c/th\u003e\u003cth scope=\"col\"\u003e需要观察的内容\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e模型消耗\u003c/td\u003e\u003ctd\u003e调用次数、输入输出量、重复上下文及可复用计算\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e运行资源\u003c/td\u003e\u003ctd\u003e程序计算、数据读取、中间结果保存，以及模型服务提供的资源与用量信息\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e处理时间\u003c/td\u003e\u003ctd\u003e数据准备、请求等待、模型处理、结果校验和完整任务耗时\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e批量处理能力\u003c/td\u003e\u003ctd\u003e单位时间完成并通过检查的任务数量，以及不同负载下的变化\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e失败与返工\u003c/td\u003e\u003ctd\u003e超时、格式错误、内容缺失、事实问题带来的重试、补做和人工修正\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e这些指标分别记录，再根据业务质量、时效和资源要求进行取舍。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. 根据实际瓶颈选择优化方式\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003e减少不必要的AI处理\u003c/strong\u003e：明确规则和确定性计算由程序承担，让AI集中处理需要理解、判断和生成的部分。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e控制重复计算与上下文\u003c/strong\u003e：整理固定说明和动态内容，评估有效结果复用、公共前缀复用，以及必要的输入输出范围。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e匹配模型与任务要求\u003c/strong\u003e：结合内容质量、结构完整性、耗时和消耗选择模型及配置。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e调整执行方式\u003c/strong\u003e：根据阶段依赖安排串行或并行，结合服务负载观察等待、异常和整体完成时间。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e控制任务处理过程中的累计消耗\u003c/strong\u003e：当AI承担任务组织时，同时关注资料检索、工具调用、反复修改及执行轮次。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e3. 用一致的任务条件验证优化效果\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e使用相同或可对照的输入与检查要求，分别观察正常结果、异常耗时和内容问题。\u003c/p\u003e\n\u003cp\u003e模型处理、网关等待与数据准备等原因，需要依据可获取的记录分析。调整后既检查局部消耗，也检查完整任务的质量、耗时和有效完成数量。\u003c/p\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 营销助手：结合内容质量与处理时间选择模型\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e实际工作：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e模型对比采用控制变量：固定输入与其他比较条件，仅切换模型，分别检查正常内容、运行时间异常，以及缺少必要标题等导致解析失败的问题。\u003c/p\u003e\n\u003cp\u003e对比发现，部分模型处理较快，但内容丰富度、事实可靠性或结构完整性不足；异常耗时记录较少，也不代表平均处理时间更短。综合比较结果后，继续使用 DeepSeek。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e体现的优化思路：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e将内容可用性、结构完整性、平均耗时及异常情况一起比较。针对异常耗时，继续分析资源负载、请求等待等可能原因，避免将所有等待都归因于算法本身。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e关注的成本：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e模型运行时间，以及无效输出造成的重试、解析失败和人工修正投入。\u003c/p\u003e\n\u003ch4\u003eb. 营销助手：推进提示词缓存优化与批量处理能力评估\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e正在推进的工作：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e将各阶段固定说明与动态客户内容分开组织，尝试通过稳定的公共前缀提高计算复用机会，并结合模型服务实际支持的缓存能力与命中条件进行验证。\u003c/p\u003e\n\u003cp\u003e结合跑批数据估算每日处理能力和更大规模任务的耗时，后续补充不同运行时段的数据以验证估算。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e体现的优化思路：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e同时关注一次请求中的重复计算，以及算法在持续运行下的有效处理能力。结合实际命中情况、处理时间和服务负载，判断提示词调整是否产生收益，并估算批量任务所需时间。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e关注的成本：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e重复输入处理、请求等待、模型运行与批量任务占用的时间。缓存收益和整体处理能力继续以实际测试为依据。\u003c/p\u003e\n\u003ch4\u003ec. 数据智能体：通过程序预匹配缩小AI处理范围\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e实际做法：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e字段覆盖验证先由程序完成字典和注释匹配，再让AI对未匹配部分补充语义判断，随后由程序核对真实字段并形成候选覆盖统计。工程师结合业务约束确认语义映射、低置信度项和可计算指标的覆盖口径，再将确认结果交给设计环节。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e体现的优化思路：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e将AI处理集中在常规规则尚未解决的部分。已有明确对应关系的内容通过程序处理，表达差异由模型判断，事实核验和统计继续由程序承担。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e关注的成本：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAI需要处理的信息范围、重复判断和推理工作量；同时保留字段真实性与匹配结果检查，避免压缩处理范围后遗漏必要内容。\u003c/p\u003e"}],"cases":[{"id":"case-data-agent","kind":"case","title":"数据研发智能体","summary":"由AI结合业务知识与Skill推进数据开发，工程师确认关键材料，程序核对事实与结果。","nodes":["ai","data","engineering","architecture","algorithm"],"order":1,"status":"practice","body":"# 数据研发智能体\n\n\n## 场景\n\n面向数据应用开发，将需求理解、资料检索、来源筛选、模型设计、代码生成与Review组织成连续工作流程。AI结合Skill中的业务经验与知识资料主导形成阶段材料，工程师在关键节点确认口径、选择与交付结果。\n\n## 我的职责\n\n我负责总体架构、核心节点、主要Skill和知识体系建设，明确接口要求，推进整体集成、团队试点与使用反馈。\n\nGo MCP封装、API后端和容器打包由团队同事负责，我承担相应的接口要求、协作与集成工作。\n\n## 方案主线\n\nAI分析需求与检索资料 → 工程师确认业务口径及来源 → 程序预匹配与AI语义补充 → 字段事实、业务语义及覆盖结果确认 → 加工设计与SQL生成 → Review、修正与交付。\n\n## 核心做法\n\n- 知识与数据治理：梳理业务对象、模型粒度、口径和适用条件，将业务概念关联到表、字段与指标，供AI理解需求和定位来源。\n- 确定性工具与语义判断配合：通过查询工具获取真实元数据，由程序完成常规匹配与覆盖统计，AI补充表达差异；低置信度映射和可计算指标的覆盖口径由工程师确认。\n- 阶段材料交接：把分析、详细设计、脚本和Review组织为成套产物，上一阶段确认的结论进入下一阶段，问题回到对应来源或设计环节修正。\n- 开发架构映射：本地维护完整逻辑与详细路由，再映射业务流程、质量要求和实际技术节点；开发助手与业务交互入口按各自任务组织交接。\n\n## 推进与交付\n\n已形成配套的分析、设计、脚本与Review交付方式，并推进团队试点和使用。持续将来源选择、统计日期、缺失处理及代码检查中的反馈回写到知识、Skill和检查规则，支持后续需求复用。","html":"\u003ch3\u003e场景\u003c/h3\u003e\n\u003cp\u003e面向数据应用开发，将需求理解、资料检索、来源筛选、模型设计、代码生成与Review组织成连续工作流程。AI结合Skill中的业务经验与知识资料主导形成阶段材料，工程师在关键节点确认口径、选择与交付结果。\u003c/p\u003e\n\u003ch3\u003e我的职责\u003c/h3\u003e\n\u003cp\u003e我负责总体架构、核心节点、主要Skill和知识体系建设，明确接口要求，推进整体集成、团队试点与使用反馈。\u003c/p\u003e\n\u003cp\u003eGo MCP封装、API后端和容器打包由团队同事负责，我承担相应的接口要求、协作与集成工作。\u003c/p\u003e\n\u003ch3\u003e方案主线\u003c/h3\u003e\n\u003cp\u003eAI分析需求与检索资料 → 工程师确认业务口径及来源 → 程序预匹配与AI语义补充 → 字段事实、业务语义及覆盖结果确认 → 加工设计与SQL生成 → Review、修正与交付。\u003c/p\u003e\n\u003ch3\u003e核心做法\u003c/h3\u003e\n\u003cul\u003e\u003cli\u003e知识与数据治理：梳理业务对象、模型粒度、口径和适用条件，将业务概念关联到表、字段与指标，供AI理解需求和定位来源。\u003c/li\u003e\u003cli\u003e确定性工具与语义判断配合：通过查询工具获取真实元数据，由程序完成常规匹配与覆盖统计，AI补充表达差异；低置信度映射和可计算指标的覆盖口径由工程师确认。\u003c/li\u003e\u003cli\u003e阶段材料交接：把分析、详细设计、脚本和Review组织为成套产物，上一阶段确认的结论进入下一阶段，问题回到对应来源或设计环节修正。\u003c/li\u003e\u003cli\u003e开发架构映射：本地维护完整逻辑与详细路由，再映射业务流程、质量要求和实际技术节点；开发助手与业务交互入口按各自任务组织交接。\u003c/li\u003e\u003c/ul\u003e\n\u003ch3\u003e推进与交付\u003c/h3\u003e\n\u003cp\u003e已形成配套的分析、设计、脚本与Review交付方式，并推进团队试点和使用。持续将来源选择、统计日期、缺失处理及代码检查中的反馈回写到知识、Skill和检查规则，支持后续需求复用。\u003c/p\u003e"},{"id":"case-voice-rag","kind":"case","title":"保险语音与知识问答","summary":"围绕知识检索、上下文与首字等待进行优化。","nodes":["ai","algorithm","cost"],"order":2,"status":"record","body":"# 保险语音与知识问答\n\n\n## 场景\n\n保险咨询通过 ASR、知识检索、LLM 和 TTS 形成语音对话链路，需要同时关注知识依据和响应体验。\n\n## 我的职责\n\n我是核心参与者，配合整理业务知识、参与RAG管线搭建，并承担语音链路中的延迟、Prompt与Token配置优化。整体选型和项目统筹由负责人承担。\n\n## 方案主线\n\n组织保险知识 → 检索候选与重排 → 组织最终上下文 → 精简重复提示与稳定前缀 → 按问题设置输出预算 → 分段观察等待与生成表现。\n\n## 具体优化\n\n- 提示词精简：合并重复的系统说明，保留当前问题需要的角色、约束与回答要求，减少无关输入。\n- 上下文组织：对检索结果去重并保持稳定的拼接顺序，配合已有模型服务的前缀缓存能力复用公共内容。\n- 输出预算：根据问题需要短答还是长答配置输出范围，减少无关展开，并核对回答是否完整。\n- 分段计时：从ASR判定用户说完的EOS事件，观察到LLM输出首个文本Token的等待；语音播放与完整对话时长分别观察。\n\n## 优化结果\n\n通过提示词、上下文组织与输出预算的联合调整，改善咨询场景中等待首个文本回复的体验。优化关注语音识别结束后的文本生成阶段，同时保留知识依据、回答完整性与模型消耗的核对。","html":"\u003ch3\u003e场景\u003c/h3\u003e\n\u003cp\u003e保险咨询通过 ASR、知识检索、LLM 和 TTS 形成语音对话链路，需要同时关注知识依据和响应体验。\u003c/p\u003e\n\u003ch3\u003e我的职责\u003c/h3\u003e\n\u003cp\u003e我是核心参与者，配合整理业务知识、参与RAG管线搭建，并承担语音链路中的延迟、Prompt与Token配置优化。整体选型和项目统筹由负责人承担。\u003c/p\u003e\n\u003ch3\u003e方案主线\u003c/h3\u003e\n\u003cp\u003e组织保险知识 → 检索候选与重排 → 组织最终上下文 → 精简重复提示与稳定前缀 → 按问题设置输出预算 → 分段观察等待与生成表现。\u003c/p\u003e\n\u003ch3\u003e具体优化\u003c/h3\u003e\n\u003cul\u003e\u003cli\u003e提示词精简：合并重复的系统说明，保留当前问题需要的角色、约束与回答要求，减少无关输入。\u003c/li\u003e\u003cli\u003e上下文组织：对检索结果去重并保持稳定的拼接顺序，配合已有模型服务的前缀缓存能力复用公共内容。\u003c/li\u003e\u003cli\u003e输出预算：根据问题需要短答还是长答配置输出范围，减少无关展开，并核对回答是否完整。\u003c/li\u003e\u003cli\u003e分段计时：从ASR判定用户说完的EOS事件，观察到LLM输出首个文本Token的等待；语音播放与完整对话时长分别观察。\u003c/li\u003e\u003c/ul\u003e\n\u003ch3\u003e优化结果\u003c/h3\u003e\n\u003cp\u003e通过提示词、上下文组织与输出预算的联合调整，改善咨询场景中等待首个文本回复的体验。优化关注语音识别结束后的文本生成阶段，同时保留知识依据、回答完整性与模型消耗的核对。\u003c/p\u003e"},{"id":"case-adoption","kind":"case","title":"团队推广与反馈迭代","summary":"将使用反馈转化为可复用的流程改进。","nodes":["ai","engineering","architecture","cost"],"order":3,"status":"record","body":"# 团队推广与反馈迭代\n\n\n## 场景\n\n数据研发智能体从单点验证进入团队试点后，需要让工程师理解分工、持续记录问题并判断实际收益。本条属于同一项目的推广实践。\n\n## 我的职责\n\n我协调业务、数据开发与相关团队补齐知识，组织培训与汇报，推动场景使用、问题收集和效能跟踪。\n\n## 方案主线\n\n小场景试点 → 固化 Skill → 培训使用 → 跟踪需求与采纳 → 分类归因 → 更新规则 → 再验证。\n\n## 实际工作\n\n- 按阶段和需求跟踪覆盖、代码采纳、人工修改与工时，用具体任务观察工具进入日常开发后的效果。\n- 结合集体培训、一对一辅导与工具使用条件，识别使用门槛及需要补充的支持。\n- 将数据来源定位、建表脚本、字段规则与最终Review中的反馈分类处理，更新知识、Skill及检查要求，再核对受影响的流程。\n\n## 评估与持续迭代\n\n观察一个需求从输入到可交付结果的总投入，将模型调用、人工修正、培训和维护一起考虑。不同阶段与场景按各自任务范围和比较基准判断，将结果用于选择下一轮优先改进的环节。","html":"\u003ch3\u003e场景\u003c/h3\u003e\n\u003cp\u003e数据研发智能体从单点验证进入团队试点后，需要让工程师理解分工、持续记录问题并判断实际收益。本条属于同一项目的推广实践。\u003c/p\u003e\n\u003ch3\u003e我的职责\u003c/h3\u003e\n\u003cp\u003e我协调业务、数据开发与相关团队补齐知识，组织培训与汇报，推动场景使用、问题收集和效能跟踪。\u003c/p\u003e\n\u003ch3\u003e方案主线\u003c/h3\u003e\n\u003cp\u003e小场景试点 → 固化 Skill → 培训使用 → 跟踪需求与采纳 → 分类归因 → 更新规则 → 再验证。\u003c/p\u003e\n\u003ch3\u003e实际工作\u003c/h3\u003e\n\u003cul\u003e\u003cli\u003e按阶段和需求跟踪覆盖、代码采纳、人工修改与工时，用具体任务观察工具进入日常开发后的效果。\u003c/li\u003e\u003cli\u003e结合集体培训、一对一辅导与工具使用条件，识别使用门槛及需要补充的支持。\u003c/li\u003e\u003cli\u003e将数据来源定位、建表脚本、字段规则与最终Review中的反馈分类处理，更新知识、Skill及检查要求，再核对受影响的流程。\u003c/li\u003e\u003c/ul\u003e\n\u003ch3\u003e评估与持续迭代\u003c/h3\u003e\n\u003cp\u003e观察一个需求从输入到可交付结果的总投入，将模型调用、人工修正、培训和维护一起考虑。不同阶段与场景按各自任务范围和比较基准判断，将结果用于选择下一轮优先改进的环节。\u003c/p\u003e"},{"id":"case-marketing","kind":"case","title":"营销画像与推荐内容生成","summary":"围绕规则与AI分工、模型质量和耗时开展优化，持续推进缓存与批量处理能力评估。","nodes":["ai","data","engineering","architecture","algorithm","cost"],"order":4,"status":"practice","body":"# 营销画像与推荐内容生成\n\n## 场景与当前状态\n\n面向客户营销辅助，融合标签、流水、走访与产品信息，生成客户画像，并围绕已有候选产品形成推荐理由、电话话术和短信内容。当前持续开展算法优化，重点兼顾内容质量、任务耗时与运行消耗。\n\n## 我的职责\n\n我负责这套算法当前阶段的分析与优化，围绕模型表现、规则与AI分工、输入口径、批量与实时衔接及运行消耗推进调整。工作聚焦画像和内容生成链路，并结合问题记录持续检查优化方向。\n\n## 算法主线\n\n标签和交易资料 → 行为特征与规则派生 → 剩余标签的模型抽象 → 静态资料、流水和走访信息融合画像 → 既有候选产品的沟通内容生成。\n\n- 程序处理分层、资产变化、活跃状态、到期事件和营销约束等明确规则。\n- 模型处理标签抽象、信息融合和语言表达，推测性内容要求标记。\n- 产品候选与顺序由上游推荐结果提供，内容生成结合候选资料与客户信息组织表达。\n- 画像中的事实、推测和建议分别核对，沟通内容保留相应的信息依据。\n\n## 数据与架构\n\n按批次组织输入，完成字段解码、去重合并、资料关联和必要检查，将不同来源整理成分阶段可用的结构化资料。模型前处理、画像生成、沟通内容生成与结果保存分别组织，明确相互交接的内容及状态。\n\n离线跑批可以预先生成画像，实时服务按场景重新生成或复用有效的批量画像，再组织产品内容。特征、候选和生成结果分别管理更新时点，复用时核对输入批次与结果有效性。\n\n## 工程机制\n\n- 批量任务按客户和阶段记录进度，支持已有产物复用与失败环节补跑；进度、生成结果和最终保存分别核对。\n- 实时链路解析并检查前置结果，前置失败时停止依赖该结果的后续阶段；批量链路的异常处理与实时链路一致性仍在完善。\n- 模型调用通过限流、有限重试、熔断及用量记录控制执行，实时请求结合总预算与准入要求管理资源。\n- 结果写入与幂等处理独立组织，结合阶段状态定位问题，持续检查中断恢复与保存结果的一致性。\n\n## 已完成的优化工作\n\n我固定输入与其他比较条件，仅切换模型进行控制变量对比，已完成内容质量、输出完整性、耗时与异常表现的比较及问题检查，并整理问题记录和相关材料。当前比较结果支持继续采用DeepSeek，后续配置调整仍按相同质量要求复核。\n\n## 正在推进的工作\n\n- 提示词与缓存：将稳定公共说明和动态客户内容分开组织，结合模型服务支持和实际命中条件验证缓存收益。\n- 批量处理能力：补充不同时段的运行数据，分析有效处理数量、耗时与异常，再估算整体任务所需时间。\n- 链路一致性：继续核对批量与实时规则、输入批次与结果失效、生成完成与结果落盘之间的对应关系。\n- 内容约束：结合事实依据检查画像与表达，将文本中的风险提示、候选筛选及实际触达控制分别落实到相应环节。\n\n## 应用范围\n\n本阶段交付客户画像和面向既有候选的沟通内容，产品排序由上游提供，实际触达由相应业务环节执行。缓存优化和批量能力评估仍在推进，效果以同一任务条件下的质量、消耗与有效完成情况判断。","html":"\u003ch3\u003e场景与当前状态\u003c/h3\u003e\n\u003cp\u003e面向客户营销辅助，融合标签、流水、走访与产品信息，生成客户画像，并围绕已有候选产品形成推荐理由、电话话术和短信内容。当前持续开展算法优化，重点兼顾内容质量、任务耗时与运行消耗。\u003c/p\u003e\n\u003ch3\u003e我的职责\u003c/h3\u003e\n\u003cp\u003e我负责这套算法当前阶段的分析与优化，围绕模型表现、规则与AI分工、输入口径、批量与实时衔接及运行消耗推进调整。工作聚焦画像和内容生成链路，并结合问题记录持续检查优化方向。\u003c/p\u003e\n\u003ch3\u003e算法主线\u003c/h3\u003e\n\u003cp\u003e标签和交易资料 → 行为特征与规则派生 → 剩余标签的模型抽象 → 静态资料、流水和走访信息融合画像 → 既有候选产品的沟通内容生成。\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e程序处理分层、资产变化、活跃状态、到期事件和营销约束等明确规则。\u003c/li\u003e\u003cli\u003e模型处理标签抽象、信息融合和语言表达，推测性内容要求标记。\u003c/li\u003e\u003cli\u003e产品候选与顺序由上游推荐结果提供，内容生成结合候选资料与客户信息组织表达。\u003c/li\u003e\u003cli\u003e画像中的事实、推测和建议分别核对，沟通内容保留相应的信息依据。\u003c/li\u003e\u003c/ul\u003e\n\u003ch3\u003e数据与架构\u003c/h3\u003e\n\u003cp\u003e按批次组织输入，完成字段解码、去重合并、资料关联和必要检查，将不同来源整理成分阶段可用的结构化资料。模型前处理、画像生成、沟通内容生成与结果保存分别组织，明确相互交接的内容及状态。\u003c/p\u003e\n\u003cp\u003e离线跑批可以预先生成画像，实时服务按场景重新生成或复用有效的批量画像，再组织产品内容。特征、候选和生成结果分别管理更新时点，复用时核对输入批次与结果有效性。\u003c/p\u003e\n\u003ch3\u003e工程机制\u003c/h3\u003e\n\u003cul\u003e\u003cli\u003e批量任务按客户和阶段记录进度，支持已有产物复用与失败环节补跑；进度、生成结果和最终保存分别核对。\u003c/li\u003e\u003cli\u003e实时链路解析并检查前置结果，前置失败时停止依赖该结果的后续阶段；批量链路的异常处理与实时链路一致性仍在完善。\u003c/li\u003e\u003cli\u003e模型调用通过限流、有限重试、熔断及用量记录控制执行，实时请求结合总预算与准入要求管理资源。\u003c/li\u003e\u003cli\u003e结果写入与幂等处理独立组织，结合阶段状态定位问题，持续检查中断恢复与保存结果的一致性。\u003c/li\u003e\u003c/ul\u003e\n\u003ch3\u003e已完成的优化工作\u003c/h3\u003e\n\u003cp\u003e我固定输入与其他比较条件，仅切换模型进行控制变量对比，已完成内容质量、输出完整性、耗时与异常表现的比较及问题检查，并整理问题记录和相关材料。当前比较结果支持继续采用DeepSeek，后续配置调整仍按相同质量要求复核。\u003c/p\u003e\n\u003ch3\u003e正在推进的工作\u003c/h3\u003e\n\u003cul\u003e\u003cli\u003e提示词与缓存：将稳定公共说明和动态客户内容分开组织，结合模型服务支持和实际命中条件验证缓存收益。\u003c/li\u003e\u003cli\u003e批量处理能力：补充不同时段的运行数据，分析有效处理数量、耗时与异常，再估算整体任务所需时间。\u003c/li\u003e\u003cli\u003e链路一致性 件。局部改动时，AI检查已有状态和交互，形成具体实现方案，经人员确认或纠偏后修改，并对照原始卡片核对影响范围。\u003c/p\u003e\n\u003ch3\u003e工程化与复用\u003c/h3\u003e\n\u003cp\u003e通用规则、模板素材、项目配置和当前交付分开维护；数据转换与扩展能力按实际需要选用。变量从能力返回到界面、用户操作和后续处理逐段核对，局部改动保留差异记录，重新检查所影响的引用、事件、资源和版本。\u003c/p\u003e\n\u003ch3\u003e检查与当前范围\u003c/h3\u003e\n\u003cp\u003e接口联调功能目前相对完善，已成为脚手架中较成熟的部分。\u003c/p\u003e\n\u003cp\u003e其他搭建与交互能力，需要在平台进入生产后，通过大量实际业务场景持续打磨。现阶段按具体场景区分草稿、静态核对、平台验证与业务验收，逐步补充正常路径、异常分支及用户状态变化下的反馈与改进。\u003c/p\u003e"}]}</script>
  <script>
    'use strict';
    const DATA = JSON.parse(document.getElementById('content-data').textContent);
    const $ = id => document.getElementById(id);
    const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const ENTRIES = Object.fromEntries([DATA.overview, ...DATA.nodes, ...DATA.edges, ...DATA.cases].map(entry => [entry.id, entry]));
    const NODES = Object.fromEntries(DATA.nodes.map(node => [node.id,node]));
    const POS = {ai:[220,120],data:[500,120],engineering:[630,300],architecture:[500,480],algorithm:[220,480],cost:[90,300]};
    const KIND = {node:'核心亮点',edge:'连接方案',case:'项目与实践',overview:'展示总览'};
    const PAGES = {home:'首页',atlas:'能力图谱',practice:'项目实践'};
    const state = {page:'home',atlasEntry:'overview',graphNode:null,caseEntry:null,filter:'all',query:'',status:'all'};
    const badge = entry => entry.status ? `<span class="badge ${esc(entry.status)}">${esc(DATA.statuses[entry.status])}</span>` : '';
    const names = ids => ids.map(id => NODES[id].title).join(' × ');
    function entryNodes(entry){return entry.kind === 'node' ? [entry.id] : (entry.nodes || []);}
    function readRoute(){
      try {
        const hash=decodeURIComponent(location.hash.slice(1));
        if(!hash || hash==='home' || hash==='overview/overview')return {page:'home'};
        if(hash==='atlas' || hash==='connections')return {page:'atlas'};
        if(hash==='practice')return {page:'practice'};
        const [kind,id]=hash.split('/');
        if(ENTRIES[id]?.kind===kind){
          if(kind==='node'||kind==='edge')return {page:'atlas',entry:id};
          if(kind==='case')return {page:'practice',entry:id};
        }
      } catch {}
      return {page:'home'};
    }
    function routeHash(){
      if(state.page==='atlas' && state.atlasEntry!=='overview')return '#'+ENTRIES[state.atlasEntry].kind+'/'+state.atlasEntry;
      if(state.page==='practice' && state.caseEntry)return '#case/'+state.caseEntry;
      return '#'+state.page;
    }
    function saveNavigation(replace=false){
      const snapshot={...state};
      if(replace || location.hash===routeHash())history.replaceState(snapshot,'',routeHash());
      else history.pushState(snapshot,'',routeHash());
    }
    function restoreSnapshot(snapshot){
      if(!snapshot)return;
      if(snapshot.atlasEntry==='overview' || ['node','edge'].includes(ENTRIES[snapshot.atlasEntry]?.kind))state.atlasEntry=snapshot.atlasEntry;
      if(NODES[snapshot.graphNode])state.graphNode=snapshot.graphNode;
      else if(snapshot.graphNode===null)state.graphNode=null;
      if(ENTRIES[snapshot.caseEntry]?.kind==='case')state.caseEntry=snapshot.caseEntry;
      if(snapshot.filter==='all'||NODES[snapshot.filter])state.filter=snapshot.filter;
      if(typeof snapshot.query==='string')state.query=snapshot.query;
      if(snapshot.status==='all'||DATA.statuses[snapshot.status])state.status=snapshot.status;
    }
    function renderGraph(){
      const focusedId = document.activeElement?.closest?.('#graph [data-entry]')?.dataset.entry;
      const entry = ENTRIES[state.atlasEntry];
      const related = entryNodes(entry);
      const isRelated=edge=>Boolean(state.graphNode && edge.nodes.includes(state.graphNode));
      const edges = [...DATA.edges].sort((a,b)=>Number(isRelated(a))-Number(isRelated(b)));
      const compactLabels = matchMedia('(max-width:480px)').matches;
      const labelFont = compactLabels ? 20 : 12;
      const labelHeight = compactLabels ? 36 : 25;
      const edgeMarkup = edges.map(edge => {
        const [p,q] = edge.nodes.map(id=>POS[id]);
        const dx=q[0]-p[0],dy=q[1]-p[1],length=Math.hypot(dx,dy),radius=57;
        const x1=p[0]+dx/length*radius,y1=p[1]+dy/length*radius,x2=q[0]-dx/length*radius,y2=q[1]-dy/length*radius;
        const d=`M ${x1} ${y1} L ${x2} ${y2}`;
        const active=edge.id===state.atlasEntry;
        const highlighted=isRelated(edge);
        const lx=(p[0]+q[0])/2,ly=(p[1]+q[1])/2;
        const label=edge.graph_label;
        const labelWidth=Math.max(76,label.length*labelFont+24);
        return `<g class="edge ${highlighted?'context':'background'}${active?' active':''}" data-entry="${esc(edge.id)}" role="button" tabindex="0" aria-pressed="${active}" aria-controls="detail" aria-label="${esc(names(edge.nodes)+'：'+edge.title)}"><title>${esc(names(edge.nodes)+' · '+edge.title)}</title><path class="hit-area" d="${d}"></path><path class="graph-line" d="${d}"></path>${highlighted?`<rect class="edge-label-bg" x="${lx-labelWidth/2}" y="${ly-labelHeight/2}" width="${labelWidth}" height="${labelHeight}" rx="${labelHeight/2}"></rect><text class="edge-label" x="${lx}" y="${ly+labelFont*.35}" style="font-size:${labelFont}px" text-anchor="middle">${esc(label)}</text>`:''}</g>`;
      }).join('');
      const nodeMarkup=DATA.nodes.map(node=>{
        const [x,y]=POS[node.id],active=state.graphNode===node.id,connected=entry.kind==='edge'&&related.includes(node.id);
        return `<g class="node${active?' active':''}${connected?' connected':''}" transform="translate(${x} ${y})" data-entry="${esc(node.id)}" role="button" tabindex="0" aria-pressed="${active||connected}" aria-controls="detail" aria-label="${esc(node.title+'：'+node.subtitle)}"><circle r="53"></circle><circle class="outer-ring" r="60"></circle><text class="node-label" y="1" text-anchor="middle">${esc(node.title)}</text><text class="node-number" y="23" text-anchor="middle">${String(node.order).padStart(2,'0')}</text></g>`;
      }).join('');
      $('graph').innerHTML=edgeMarkup+nodeMarkup;
      if(focusedId) $('graph').querySelector(`[data-entry="${focusedId}"]`)?.focus();
      $('graph-selection').textContent=state.graphNode ? NODES[state.graphNode].title+' · 五条连接高亮' : '全部连接淡显 · 点击概念高亮';
      $('graph-caption').innerHTML = entry.kind==='edge' ? `<strong>${esc(names(entry.nodes))}</strong> · ${esc(entry.title)}` : state.graphNode ? `<strong>${esc(NODES[state.graphNode].title)}</strong> · 5 条连接与右侧方案一一对应` : '选择一个亮点，展开它的五条连接。';
    }
    function renderAtlasDetail(){
      const entry=ENTRIES[state.atlasEntry];
      const label=entry.kind==='node' ? `${String(entry.order).padStart(2,'0')} / ${entry.title}` : entry.kind==='edge' ? names(entry.nodes) : KIND[entry.kind];
      $('detail-kind').textContent=entry.kind==='overview' ? label : KIND[entry.kind]+' · '+label;
      $('detail-badge').innerHTML=badge(entry);
      $('detail-title').textContent=entry.kind==='node' ? entry.title+' · '+entry.subtitle : entry.title;
      $('detail-subtitle').textContent=entry.summary || DATA.overview.intro;
      $('detail-subtitle').hidden=entry.kind==='node';
      const nodeEdges=entry.kind==='node' ? DATA.edges.filter(edge=>edge.nodes.includes(entry.id)) : [];
      $('detail-navigation').innerHTML=entry.kind==='edge' && state.graphNode ? `<button class="text-button back-to-node" data-entry="${esc(state.graphNode)}">← 返回${esc(NODES[state.graphNode].title)}节点</button>` : '';
      $('detail-connections').innerHTML=nodeEdges.length ? `<p class="node-schemes-heading">五条连接方案 · 点击查看完整内容</p>${nodeEdges.map(edge=>`<button class="node-scheme" data-entry="${esc(edge.id)}" data-related-edge="${esc(edge.id)}" aria-controls="detail" aria-label="${esc(names(edge.nodes)+'：'+edge.title)}"><span class="node-scheme-heading"><strong>${esc(edge.graph_label)}</strong><span class="node-scheme-pair">${esc(names(edge.nodes))} ↗</span></span><span class="node-scheme-summary">${esc(edge.summary)}</span></button>`).join('')}` : '';
      $('detail-body').innerHTML=entry.html || '';
      $('detail-scroll').scrollTop=0;
      $('detail-related').innerHTML='';
      $('detail-footnote').textContent=entry.kind==='node' ? '能力说明与连接方案' : entry.kind==='edge' ? '问题 · 方案 · 示例' : '从图中选择能力，查看说明与连接';
      $('selection-announcement').textContent='已选择：'+entry.title;
    }
    function matchesCase(entry){
      if(state.filter!=='all'&&!entry.nodes.includes(state.filter))return false;
      if(state.status!=='all'&&entry.status!==state.status)return false;
      const haystack=[entry.title,entry.summary,entry.body,names(entry.nodes)].join(' ').toLowerCase();
      return state.query.trim().toLowerCase().split(/\s+/).filter(Boolean).every(term=>haystack.includes(term));
    }
    function renderHome(){
      $('home-nodes').innerHTML=DATA.nodes.map(node=>`<button class="home-node" data-entry="${esc(node.id)}"><span class="home-node-top"><h3>${esc(node.title)}</h3><span class="tiny-index">${String(node.order).padStart(2,'0')}</span></span><p>${esc(node.summary)}</p><span class="home-node-arrow">在图谱中查看 ↗</span></button>`).join('');
    }
    function renderCases(){
      const cases=DATA.cases.filter(matchesCase);
      $('filters').innerHTML=[{id:'all',title:'全部'},...DATA.nodes].map(node=>`<button class="chip" data-filter="${esc(node.id)}" aria-pressed="${state.filter===node.id}">${esc(node.title)}</button>`).join('');
      $('case-list').setAttribute('data-count',String(cases.length));
      $('result-count').textContent=`${cases.length} / ${DATA.cases.length} 个实践`;
      $('clear-search').hidden=!state.query;
      $('case-list').innerHTML=cases.length?cases.map(item=>`<button class="case-card" data-entry="${esc(item.id)}" aria-controls="project-detail"><div class="case-top"><span class="case-number">${String(item.order).padStart(2,'0')}</span>${badge(item)}</div><h3>${esc(item.title)}</h3><p>${esc(item.summary)}</p><div class="case-bottom"><div class="case-tags">${item.nodes.map(id=>`<span>${esc(NODES[id].title)}</span>`).join('')}</div><span class="connection-arrow" aria-hidden="true">↗</span></div></button>`).join(''):'<div class="empty">没有符合当前条件的项目实践。<br><button class="button" data-reset-filters>清除筛选条件</button></div>';
    }
    function renderProjectDetail(){
      const item=ENTRIES[state.caseEntry];
      const selected=item?.kind==='case';
      $('project-catalog').hidden=selected;
      $('project-detail').hidden=!selected;
      if(!selected)return;
      $('project-detail-title').textContent=item.title;
      $('project-summary').textContent=item.summary;
      $('project-badge').innerHTML=badge(item);
      $('project-body').innerHTML=item.html;
      $('project-related').innerHTML='<span class="project-related-label">相关能力</span>'+item.nodes.map(id=>`<button class="chip" data-entry="${esc(id)}">${esc(NODES[id].title)} ↗</button>`).join('');
      $('project-announcement').textContent='已打开项目：'+item.title;
    }
    function renderPage(){
      for(const id of Object.keys(PAGES)){
        $('page-'+id).hidden=state.page!==id;
        $('nav-'+id).setAttribute('aria-current',state.page===id?'page':'false');
      }
      $('search').value=state.query;
      $('status-filter').value=state.status;
      document.title=PAGES[state.page]+' · '+DATA.overview.title;
      renderGraph();renderAtlasDetail();renderCases();renderProjectDetail();
    }
    function focusPage(){
      const target=state.page==='home'?'hero-title':state.page==='atlas'?'atlas-title':'practice-title';
      $('main').scrollIntoView({behavior:'auto',block:'start'});
      $(target).focus({preventScroll:true});
    }
    function navigatePage(page,options={}){
      if(!PAGES[page])return;
      state.page=page;
      if(page==='practice')state.caseEntry=null;
      renderPage();
      if(options.history!==false)saveNavigation();
      if(options.scroll!==false)focusPage();
    }
    function selectEntry(id,options={}){
      const entry=ENTRIES[id];if(!entry)return;
      const previousPage=state.page;
      if(entry.kind==='node'){
        state.page='atlas';state.atlasEntry=id;state.graphNode=id;
      } else if(entry.kind==='edge'){
        state.page='atlas';state.atlasEntry=id;
        const anchor=options.graphNode||state.graphNode;
        state.graphNode=entry.nodes.includes(anchor)?anchor:entry.nodes[0];
      } else if(entry.kind==='case'){
        state.page='practice';state.caseEntry=id;
      } else {navigatePage('home',options);return;}
      renderPage();
      if(options.history!==false)saveNavigation();
      if(entry.kind==='case'){
        $('project-detail').scrollIntoView({behavior:'auto',block:'start'});
        $('project-detail-title').focus({preventScroll:true});
      } else if(previousPage!==state.page || options.scroll){
        $('main').scrollIntoView({behavior:'auto',block:'start'});
        $('detail-title').focus({preventScroll:true});
      }
    }
    function resetFilters(){
      state.filter='all';state.query='';state.status='all';
      $('search').value='';$('status-filter').value='all';renderCases();saveNavigation(true);
    }
    function applyRoute(snapshot){
      restoreSnapshot(snapshot);
      const route=readRoute();state.page=route.page;
      if(route.page==='atlas'){
        state.atlasEntry=route.entry||'overview';
        const entry=ENTRIES[state.atlasEntry];
        if(entry.kind==='node')state.graphNode=entry.id;
        else if(entry.kind==='edge')state.graphNode=entry.nodes.includes(state.graphNode)?state.graphNode:entry.nodes[0];
        else state.graphNode=null;
      }
      if(route.page==='practice')state.caseEntry=route.entry||null;
      renderPage();
    }
    document.addEventListener('click',event=>{
      const skip=event.target.closest('[data-skip-content]');
      if(skip){event.preventDefault();$('main').focus();$('main').scrollIntoView({behavior:'auto',block:'start'});return;}
      const pageLink=event.target.closest('[data-page]');
      if(pageLink){event.preventDefault();navigatePage(pageLink.dataset.page);return;}
      const entryButton=event.target.closest('[data-entry]');
      if(entryButton){selectEntry(entryButton.dataset.entry);return;}
      const filterButton=event.target.closest('[data-filter]');
      if(filterButton){state.filter=filterButton.dataset.filter;renderCases();saveNavigation(true);$('filters').querySelector(`[data-filter="${state.filter}"]`)?.focus();return;}
      if(event.target.closest('[data-reset-filters]'))resetFilters();
    });
    $('graph').addEventListener('keydown',event=>{
      if(event.key!=='Enter'&&event.key!==' ')return;
      const target=event.target.closest('[data-entry]');
      if(target){event.preventDefault();selectEntry(target.dataset.entry);}
    });
    $('reset-graph').addEventListener('click',()=>{
      state.atlasEntry='overview';state.graphNode=null;state.page='atlas';renderPage();saveNavigation();
    });
    $('project-back').addEventListener('click',()=>navigatePage('practice'));
    $('search').addEventListener('input',event=>{state.query=event.target.value;renderCases();saveNavigation(true);});
    $('search').addEventListener('keydown',event=>{if(event.key==='Escape'){state.query='';event.target.value='';renderCases();saveNavigation(true);}});
    $('clear-search').addEventListener('click',()=>{state.query='';$('search').value='';renderCases();saveNavigation(true);$('search').focus();});
    $('status-filter').addEventListener('change',event=>{state.status=event.target.value;renderCases();saveNavigation(true);});
    window.addEventListener('popstate',event=>applyRoute(event.state));
    window.addEventListener('hashchange',()=>{if(location.hash!==routeHash())applyRoute(history.state);});
    window.addEventListener('resize',renderGraph);
    $('brand-name').textContent=DATA.overview.author+' / 技术展示';
    if(DATA.overview.contact_email){
      $('contact-email').textContent=DATA.overview.contact_email;
      $('contact-email').setAttribute('href','mailto:'+DATA.overview.contact_email);
      $('contact-email').hidden=false;
    }
    const headline=DATA.overview.headline.split('，');
    $('hero-title').innerHTML=headline.length===2?esc(headline[0])+'，<br><span class="second">'+esc(headline[1])+'</span>':esc(DATA.overview.headline);
    $('intro').textContent=DATA.overview.intro;
    const featuredCase=ENTRIES[DATA.overview.featured_case];
    if(featuredCase){
      $('latest-practice').hidden=false;
      $('latest-practice').dataset.entry=featuredCase.id;
      $('latest-practice').textContent='项目实践 · '+featuredCase.title+' ↗';
    }
    renderHome();applyRoute(history.state);saveNavigation(true);
  </script>
</body>
</html>
