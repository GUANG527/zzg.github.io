  <script type="application/json" id="content-data">{"overview":{"id":"overview","kind":"overview","title":"张先生 · 技术能力全景","author":"张先生","contact_email":"17820449109@163.com","featured_case":"case-card-scaffold","headline":"从人主导，到 AI 主导。","intro":"围绕 AI、数据、工程化、架构、算法、成本，展示从业务理解到知识组织、工具协作与结果复核的完整思路。","html":"\u003cp\u003e以真实任务为起点，将业务知识、数据资产与 AI 能力组织成可以交接、检查和持续改进的方案。\u003c/p\u003e\n\u003cp\u003e点击能力节点查看具体做法，沿连线阅读方案和示例。\u003c/p\u003e"},"statuses":{"practice":"工程实践","record":"项目复盘","design":"方案设计"},"nodes":[{"id":"ai","kind":"node","title":"AI","subtitle":"让AI理解并推进任务","summary":"组织知识、经验与工具，让AI在明确边界内承担理解、判断与实现工作，并以工程控制和人工确认支撑交付。","order":1,"status":"practice","html":"\u003ch3\u003e一句话概括\u003c/h3\u003e\n\u003cp\u003e将知识、工具和业务经验组织为AI可用的能力，让AI在明确边界内理解任务、形成方案并主导推进，人员在关键节点确认，程序承担确定性处理。\u003c/p\u003e\n\u003ch3\u003e具体能力\u003c/h3\u003e\n\u003cul\u003e\u003cli\u003e知识理解与检索：通过知识库组织业务概念、数据映射与使用约束，以本体论建立业务人员和AI共享的语义，并按任务分层检索所需资料。\u003c/li\u003e\u003cli\u003e工程控制：按人员、AI和工具的能力划分流程节点，明确输入输出、检查与继续条件，结合链路追踪、断点和记忆设计反馈与恢复。\u003c/li\u003e\u003cli\u003eAI主导协作：将业务经验、操作规范和检查要求写入Skill，由AI主导分析、设计、生成和阶段推进，工程师确认关键材料并验收结果。\u003c/li\u003e\u003cli\u003e任务判断与实现：区分AI作为指定技术节点和任务处理节点的两种定位；在目标、权限和工具边界内，让AI选择配置、组织代码及衔接工具。\u003c/li\u003e\u003cli\u003e模型使用与费用：按任务质量要求比较模型与使用方式，拆开观察输入输出、缓存计费和重复调用，通过必要上下文与有效结果复用控制模型消耗。\u003c/li\u003e\u003c/ul\u003e"},{"id":"data","kind":"node","title":"数据","subtitle":"让结构具有业务含义","summary":"连接业务语义与物理数据，围绕AI可用、数仓建模、字段解析和资产复用组织数据。","order":2,"status":"practice","html":"\u003ch3\u003e一句话概括\u003c/h3\u003e\n\u003cp\u003e围绕业务对象、粒度、口径和使用条件组织数据，从知识映射、治理到数仓建模与字段解析，让数据能够被业务理解，并被AI与程序正确使用。\u003c/p\u003e\n\u003ch3\u003e具体能力\u003c/h3\u003e\n\u003cul\u003e\u003cli\u003e业务知识映射：以对象、属性、关系和约束梳理业务概念，关联表、字段、指标与计算依赖，供业务人员和AI查找、理解及核验。\u003c/li\u003e\u003cli\u003e面向AI的数据治理：补齐主题、粒度、口径、范围、元数据和血缘，将确认后的定义与映射沉淀为可读取、可查询的资料，歧义和缺失项保留待确认。\u003c/li\u003e\u003cli\u003e数仓建模：从业务过程与记录粒度出发，划分事实、维度和主题模型，明确数仓各层、公共模型以及加工与查询的职责。\u003c/li\u003e\u003cli\u003e字段解析与选型：按数据位置、字段结构、规模和结果用途选择引擎内处理、自定义程序或组合方式，核对空值、编码映射、展开与异常处理的一致性。\u003c/li\u003e\u003cli\u003e开发与复用评估：先判断已有资产的支撑范围和实际缺口，再比较新增开发、查找理解、接入适配、重复计算与持续维护的投入。\u003c/li\u003e\u003c/ul\u003e"},{"id":"engineering","kind":"node","title":"工程化","subtitle":"让完整流程稳定交付","summary":"从PoC完整逻辑出发，逐层映射业务与技术实现，通过流程控制、数据约定和算法解耦支撑持续交付。","order":3,"status":"practice","html":"\u003ch3\u003e一句话概括\u003c/h3\u003e\n\u003cp\u003e从本地PoC的完整逻辑出发，按业务流程与技术节点逐层落地，将算法、数据和AI组织为可校验、可追踪、可恢复并能持续维护的工作流程。\u003c/p\u003e\n\u003ch3\u003e具体能力\u003c/h3\u003e\n\u003cul\u003e\u003cli\u003eAI流程控制：按业务、开发、AI和程序的能力设置节点，明确输入输出、继续条件与人工确认，结合阶段状态、链路追踪和检查点设计异常处理与恢复。\u003c/li\u003e\u003cli\u003e治理结果落地：把确认后的业务定义、数据映射和使用约束写入维护模板、结构化资料与查询工具，使治理成果能够在实际任务中被AI使用。\u003c/li\u003e\u003cli\u003e三层开发映射：在本地维护完整逻辑和详细路由，再梳理知识库、AI算法与人机交互，最后映射到实际数据库、接口、权限和运行环境，并回查业务结果。\u003c/li\u003e\u003cli\u003e算法拆分与稳定性：按架构与功能解耦数据适配、算法处理、流程编排和结果交付，从核心路径可行性扩展到边界、超时、失败及变更验证。\u003c/li\u003e\u003cli\u003e开发与维护：按阶段安排建设深度，复用工具和公共流程，持续维护交接材料、依赖和版本依据，综合考虑首次开发、故障修复与后续升级投入。\u003c/li\u003e\u003c/ul\u003e"},{"id":"architecture","kind":"node","title":"架构","subtitle":"让职责、流程与实现对应","summary":"统筹人员、AI、知识与程序的职责，组织数据分层和算法协同，维护开发逻辑与实际实现的对应关系。","order":4,"status":"practice","html":"\u003ch3\u003e一句话概括\u003c/h3\u003e\n\u003cp\u003e从业务职责、数据分层、算法协同和运行边界出发，明确知识、人员、AI与程序的组织方式，维护完整逻辑、业务流程与技术实现之间的对应关系。\u003c/p\u003e\n\u003ch3\u003e具体能力\u003c/h3\u003e\n\u003cul\u003e\u003cli\u003eAI协作架构：将知识、Skill和工具组织为AI可用的能力，由AI主导相应任务，人员承担关键确认与验收，程序和平台负责确定性处理与实际执行。\u003c/li\u003e\u003cli\u003e数仓架构：围绕业务主题、记录粒度和公共维度组织分层，安排模型复用、任务依赖、数据更新，以及批量加工与查询服务的职责。\u003c/li\u003e\u003cli\u003e三层开发架构：持续维护本地PoC/Demo的完整逻辑，逐层映射业务流程、质量要求与实际技术节点，使调整能够回到原有路由核对。\u003c/li\u003e\u003cli\u003e算法组织与协同：分别判断整体设计是否完整、任务由谁组织推进，以及AI承担技术节点还是任务处理；明确算法依赖、交接方式与自主范围，按环节组合固定流程和自主实现。\u003c/li\u003e\u003cli\u003e成本结构判断：比较公共底座与独立建设、批量准备与实时处理、平台能力与独立扩展，同时评估固定投入、持续消耗和新增场景的扩展投入。\u003c/li\u003e\u003c/ul\u003e"},{"id":"algorithm","kind":"node","title":"算法","subtitle":"让效果有优化路径","summary":"围绕业务任务组合程序处理与AI能力，结合架构、工程要求和实际瓶颈优化应用算法。","order":5,"status":"practice","html":"\u003ch3\u003e一句话概括\u003c/h3\u003e\n\u003cp\u003e围绕业务任务设计应用算法，将确定性处理与AI理解、判断和生成组合起来，在架构与工程边界内持续核对结果质量、稳定性和运行效率。\u003c/p\u003e\n\u003ch3\u003e具体能力\u003c/h3\u003e\n\u003cul\u003e\u003cli\u003eAI算法定位：既能将AI用于语义匹配、检索与生成等技术节点，也能让AI在约定目标和工具范围内承担部分业务判断，自主组织具体实现方式。\u003c/li\u003e\u003cli\u003e解析策略选择：将字段提取、编码映射、对象遍历与异常处理拆清，结合输入位置、结构和规模比较引擎内处理、自定义程序及协同执行。\u003c/li\u003e\u003cli\u003e工程化拆分：按照功能与依赖组织规则、特征、检索、推理和结果校验，明确交接结构与失败状态，支持局部替换及完整流程验证。\u003c/li\u003e\u003cli\u003e架构中的算法协同：明确哪些流程预设、哪些处理允许AI自主选择，组织知识、工具和人员的配合，控制依赖、职责与结果使用边界。\u003c/li\u003e\u003cli\u003e质量与效能优化：依据实际问题比较模型、上下文、复用和执行方式，同时观察有效结果、运行资源、处理时间、批量能力与失败返工；营销缓存和规模评估继续按实际进展验证。\u003c/li\u003e\u003c/ul\u003e"},{"id":"cost","kind":"node","title":"成本","subtitle":"让全流程投入可比较","summary":"在统一业务范围、质量与时效要求下，比较模型、数据、工程、架构和算法运行带来的各类投入。","order":6,"status":"practice","html":"\u003ch3\u003e一句话概括\u003c/h3\u003e\n\u003cp\u003e将成本纳入完整方案，在业务范围、结果质量与时效要求一致的前提下，综合比较模型使用、数据开发复用、工程维护、架构扩展和算法运行的投入。\u003c/p\u003e\n\u003ch3\u003e具体能力\u003c/h3\u003e\n\u003cul\u003e\u003cli\u003e大模型费用：拆清使用方式、模型单价、输入输出、缓存与累计调用，区分实际用量、套餐可用量估算与API按量计费，并在质量要求下比较费用。\u003c/li\u003e\u003cli\u003e数据开发与复用：同时评估需求分析、建模加工与验证交付，以及查找理解、接入适配、重复计算和持续使用已有资产的成本。\u003c/li\u003e\u003cli\u003e工程开发与维护：综合考虑首次建设、问题定位、人工修正、培训交接、规则变更及兼容升级，按使用周期安排通用能力和检查机制的投入。\u003c/li\u003e\u003cli\u003e架构成本结构：观察共享建设、计算时点和能力承载方式如何改变固定投入、持续消耗与扩展投入，根据实际规模决定演进方式。\u003c/li\u003e\u003cli\u003eAI算法运行效率：围绕可用结果评估模型消耗、运行资源、时间、批量能力与失败返工，结合模型比较、有效结果复用及正在推进的缓存优化验证取舍。\u003c/li\u003e\u003c/ul\u003e"}],"edges":[{"id":"ai-data","kind":"edge","title":"知识库：语义建模与分层检索","summary":"把业务知识、数据事实与使用规则组织成共同的知识体系，让业务人员能够理解、确认，也让 AI 能够检索、解释和用于任务处理。","graph_label":"知识库","nodes":["ai","data"],"status":"practice","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003e数据结构能够说明有哪些表和字段，但业务工作还需要理解：数据代表什么、按什么口径统计、适用于什么范围，以及不同对象之间如何关联。\u003c/p\u003e\n\u003cp\u003e这些知识往往分散在业务文档、指标定义、工程脚本和人员经验中。同一个名称可能对应不同含义，名称不同的内容也可能表达同一业务概念。缺少统一组织时，业务人员难以核对，AI 也容易找到表达相近、实际不适用的内容。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e以知识库作为 AI 与数据之间的连接载体。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e统一组织业务术语、实体说明、指标定义、元数据、关系知识和使用规则，将业务经验转成可以查找、解释和核验的知识资产。知识既可以用文档和结构化索引承载，也可以根据需要进一步组织成知识图谱。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e以本体论思想建立更严谨的语义模型。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e明确业务中有哪些对象、对象具有什么属性、对象之间存在什么关系，以及使用这些知识需要满足哪些约束。本体建模能够为知识图谱提供清晰的概念与关系定义，也能帮助统一不同资料中的业务表达。\u003c/p\u003e\n\u003cp\u003e这套方法同时面向两类使用者：\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003e业务人员\u003c/strong\u003e可以用熟悉的业务术语理解对象、指标、口径和关系，参与定义、确认与修订。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eAI\u003c/strong\u003e可以依据同一套概念、关系和约束理解需求，检索相关知识并形成有依据的候选结果。\u003c/li\u003e\u003c/ul\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 数据研发：从业务经验到可检索的知识\u003c/h4\u003e\n\u003cp\u003e将原本依赖业务人员和开发人员经验判断的内容，整理为表实体对象说明。除表名、字段和注释外，补充业务主题、指标分类、粒度、口径、数据范围和业务说明，并结合工程脚本追溯核对。\u003c/p\u003e\n\u003cp\u003e收到新需求后，先把目标需求表达成具有相同语义属性的对象，再匹配候选来源范围，验证实际字段覆盖，补充必要的关联来源，继续进入加工设计。业务人员能够检查语义定义，AI 也能够沿同一套知识理解和寻找数据。\u003c/p\u003e\n\u003ch4\u003eb. 分层检索：先明确业务范围，再逐级匹配\u003c/h4\u003e\n\u003cp\u003e同一个指标名称在不同业务范围中可能代表不同口径。检索时先结合上下文确定业务域、主题和口径，再逐级组织匹配：\u003c/p\u003e\n\u003col\u003e\u003cli\u003e优先查找名称与定义明确对应的知识。\u003c/li\u003e\u003cli\u003e精确匹配未解决需求时，扩大到别名、相近表达等模糊匹配。\u003c/li\u003e\u003cli\u003e仍未解决时，引入语义召回，并对候选重新排序和核对业务约束。\u003c/li\u003e\u003cli\u003e无法唯一确定业务含义时，保留候选并补充确认，不强行替用户选择口径。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e分层策略既保留确定性匹配的可解释性，也利用语义检索处理不同表达。各层的检索范围、候选和最终依据可以分别记录，用来定位问题并进行回归。\u003c/p\u003e\n\u003ch4\u003ec. 本体映射：业务概念与数据来源的共同表达\u003c/h4\u003e\n\u003cp\u003e以通用的“客户月度交易金额”为例，仅说明映射方式，不使用项目真实表名、字段或业务规则：\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e本体要素\u003c/th\u003e\u003cth scope=\"col\"\u003e通用映射示例\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e业务对象\u003c/td\u003e\u003ctd\u003e客户、交易、机构、时间\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e指标语义\u003c/td\u003e\u003ctd\u003e按已确认口径，归集客户在指定月份内的交易金额\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e对象关系\u003c/td\u003e\u003ctd\u003e客户发生交易，交易归属机构，指标由交易事实汇总形成\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e业务约束\u003c/td\u003e\u003ctd\u003e统计粒度、统计月份、有效交易条件、金额口径和单位\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e数据映射\u003c/td\u003e\u003ctd\u003e对应经核验的来源表、业务标识、金额及时间等字段，并确认关联条件\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e业务人员从这套表达中核对“统计的是什么、适用什么规则”；AI 则依据同一模型识别对象、检索定义、拆解依赖并核验来源。业务概念、关系、约束与物理数据因此形成可以共同讨论和追溯的映射。\u003c/p\u003e\n\u003ch4\u003ed. 营销生成：区分事实、规则结果与模型推断\u003c/h4\u003e\n\u003cp\u003e将客户标签、行为资料和业务记录按来源整理，先由程序形成明确的规则结果，再交给模型理解剩余信息并融合画像。明确事实、规则判断和推测各自的来源，使生成内容有可追溯的业务上下文。\u003c/p\u003e\n\u003cp\u003e知识库在这里同时保存“已有信息”与“怎样解释和使用这些信息”的规则。业务人员可以核对画像依据，AI 则利用明确的上下文组织判断和表达，避免把推测当成已经确认的事实。\u003c/p\u003e\n\u003ch4\u003ee. 卡片脚手架：让流程、数据与交互共享知识\u003c/h4\u003e\n\u003cp\u003e从需求中提取用户目标、业务对象、前置条件和异常分支，并为每个环节说明已有数据、产生的数据和下游用途。AI 据此理解卡片需要展示和收集什么，业务人员则可以沿流程核对实际使用方式。\u003c/p\u003e\n\u003cp\u003e把流程规则、数据交接和用户状态共同维护，缺少业务含义时保留待确认项。字段、交互或业务要求发生变化后，能够根据这些关系找到受影响的环节，保持需求理解、数据使用和界面表达的一致性。\u003c/p\u003e"},{"id":"ai-engineering","kind":"edge","title":"业务流程中的 AI 工程控制","summary":"根据业务人员、开发人员、AI 和程序工具的不同能力，设计工作流程、节点边界与反馈机制，让数据、代码和模型共同支撑业务任务的稳定交付。","graph_label":"工程控制","nodes":["ai","engineering"],"status":"practice","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003eAI 能够理解需求、分析语义和生成候选结果，但输出会受到输入信息、上下文、模型行为和外部工具状态的影响。格式约束解决了部分结构问题，业务上的稳定交付还需要流程分工、事实核验、状态管理和反馈控制。\u003c/p\u003e\n\u003cp\u003e在完整业务流程中，还需要处理业务确认、数据变化、代码修改、工具失败和任务中断。工程设计需要回答：每一步由谁负责，依据什么继续，失败后怎样处理，以及恢复时哪些结果仍然有效。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e1．先分析业务过程，再按能力设置节点。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e从业务目标、工作对象、判断依据和交付要求出发，确定各环节的承担者与交接方式。\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e参与方\u003c/th\u003e\u003cth scope=\"col\"\u003e主要职责\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e业务人员\u003c/td\u003e\u003ctd\u003e明确业务目标、口径、规则和例外，确认关键业务含义与结果是否适用\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e开发人员\u003c/td\u003e\u003ctd\u003e设计流程与控制边界，实现工具、检查和恢复机制，审查代码及交付结果\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAI\u003c/td\u003e\u003ctd\u003e理解需求、补充语义判断、提出方案、生成候选内容并说明依据\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e程序与工具\u003c/td\u003e\u003ctd\u003e查询事实、执行计算、解析结构、检查约束、保存状态和执行已授权操作\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e明确规则和确定性处理由程序承担；需要理解、分析和生成的环节发挥 AI 的能力；业务含义和关键取舍由相应人员确认。\u003c/p\u003e\n\u003cp\u003e节点划分同时考虑结果能否验证、失败影响、恢复成本和人工判断需求，使每一步都有明确的输入、输出与继续条件。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2．把输入输出稳定性落实到每个节点。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e为 AI 节点明确四类约定：\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003e输入依据\u003c/strong\u003e：当前任务、已确认条件、相关知识、数据和代码范围。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e输出要求\u003c/strong\u003e：结果结构、业务含义、来源依据、未解决事项和使用边界。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e校验方式\u003c/strong\u003e：结构是否正确、事实是否存在、口径是否一致、代码及数据结果是否满足要求。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e流转条件\u003c/strong\u003e：什么结果可以进入下一步，什么情况需要补充信息、重新处理或人工确认。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e上游输出经过适当校验后，才成为下游的有效输入。格式正确、内容正确和业务可用分别检查。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3．用工程控制论视角建立反馈闭环。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e将完整业务过程作为控制对象，围绕目标持续观察执行状态和结果，比较实际情况与预期要求，再选择调整动作。这里将反馈控制中的观测、比较与纠偏思想应用于 AI 工程设计。\u003ca href=\"https://www.cds.caltech.edu/~murray/FBS/Chapter_1_-_Introduction.html\"\u003e反馈控制方法参考\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e目标与约束 → 输入准备与节点执行 → 状态观测与结果校验 → 调整、恢复或人工介入 → 再次校验。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e控制要素\u003c/th\u003e\u003cth scope=\"col\"\u003e在 AI 工程中的体现\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e目标\u003c/td\u003e\u003ctd\u003e明确任务完成条件，以及正确性、时效和资源约束\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e观测\u003c/td\u003e\u003ctd\u003e记录输入依据、执行状态、调用结果、阶段产物及检查结论\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e比较\u003c/td\u003e\u003ctd\u003e对照需求、业务规则、数据事实和验收条件识别偏差\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e调整\u003c/td\u003e\u003ctd\u003e根据问题类型补充信息、修改代码、有限重试、回退、转人工或停止\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e反馈\u003c/td\u003e\u003ctd\u003e将确认的问题及修正结果回写到流程、知识、代码或检查规则，并进行回归\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e反馈需要影响后续执行。信息不足回到确认环节，来源不适用重新检查数据，代码错误回到对应修改范围，工具暂时失败采用有限重试。\u003c/p\u003e\n\u003cp\u003e每次调整都有问题依据、作用范围和结束条件。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4．通过断点和记忆保持流程连续性。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e在人工确认、阶段交接和容易失败的位置设计检查点，保留能够支持继续执行的状态。检查点与跨任务复用的长期信息承担不同职责，需要分别设计。\u003ca href=\"https://docs.langchain.com/oss/python/langgraph/persistence\"\u003e检查点与持久化参考\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003e运行状态与检查点\u003c/strong\u003e：保存当前节点、完成情况、阶段结果、待确认事项和恢复条件。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e当前任务记忆\u003c/strong\u003e：保留已确认需求、约束、阶段结论和仍需解决的问题。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e长期可复用记忆\u003c/strong\u003e：保存经确认、对后续任务仍有价值的信息，并支持修正、失效和删除。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e组织知识\u003c/strong\u003e：业务定义、数据说明和代码规范，由相应知识库维护来源与版本。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e这些是信息职责的划分，可以按实际需要组合存储。\u003c/p\u003e\n\u003cp\u003e恢复前，需要检查已有结果对应的数据、代码和规则是否仍然适用。发生变化时，重新核对受影响的节点；涉及外部写入或提交时，还要核对实际执行记录，区分结果生成、操作执行和保存完成。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5．把链路追踪与数据、代码管控结合起来。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e围绕一次完整任务，关联需求、输入依据、节点调用、阶段输出、校验结果、人工确认和最终产物。\u003c/p\u003e\n\u003cp\u003e数据侧关注来源、结构、粒度、口径、范围及有效性；代码侧关注基线、改动范围、依赖、检查结果和交付版本。同时记录本次使用的模型、提示词、知识和流程版本，使问题能够追溯到具体条件。\u003c/p\u003e\n\u003cp\u003e追踪记录保留必要的摘要、引用和状态变化，业务明细按实际权限与存储要求管理。\u003c/p\u003e\n\u003cp\u003e当结果出现偏差时，沿链路找到问题首次出现的位置，再决定修正数据、代码、知识、流程或人工判断。变更后重新核验受影响的下游，形成有依据的工程反馈。\u003c/p\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 数据研发：按能力拆分完整开发链路\u003c/h4\u003e\n\u003cp\u003e把业务确认、需求分析、来源选择、详细设计、脚本生成和检查组织为连续步骤。业务人员确认口径，AI 辅助理解需求和形成候选方案，程序查询事实并计算覆盖情况，开发人员审查实现和交付结果。\u003c/p\u003e\n\u003cp\u003e上一阶段确认的产物作为下一阶段的依据。发现缺失条件或来源问题时，回到对应环节补充，再继续推进，使数据开发过程具有明确的职责和控制点。\u003c/p\u003e\n\u003ch4\u003eb. 营销实时链路：用阶段契约控制依赖关系\u003c/h4\u003e\n\u003cp\u003e在营销实时链路中，将资料整理、信息抽象、画像融合和后续内容生成分阶段组织。每个阶段只使用当前需要的信息，前置输出通过相应解析与有效性检查后，再交给依赖环节。\u003c/p\u003e\n\u003cp\u003e实时链路在前置结果解析失败、必要结果为空或依赖阶段失败时，阻止相应后续处理，并记录阶段状态。阶段状态与结果保存分别核对，便于识别任务停在哪里、哪些内容能够复用、哪些环节需要补做。\u003c/p\u003e\n\u003cp\u003e批量链路的部分解析异常仍采用保留原始输出后继续处理的方式。批量与实时的异常处理、结果有效性和保存一致性需要分别核对，逐步完善统一的阶段约定。\u003c/p\u003e\n\u003ch4\u003ec. 链路追踪：从最终问题定位到具体环节\u003c/h4\u003e\n\u003cp\u003e在运行机制设计中，将检索、工具调用、生成、校验和交付等步骤关联到同一次任务，记录各阶段使用的依据、必要输入输出摘要及检查结果。\u003c/p\u003e\n\u003cp\u003e最终结果有问题时，逐段检查检索范围、来源选择、工具返回、生成内容和校验结论，寻找偏差首次出现的位置。修正后沿受影响的链路重新检查，避免只反复修改最终回答。\u003c/p\u003e\n\u003ch4\u003ed. 断点与记忆：让长任务有依据地继续\u003c/h4\u003e\n\u003cp\u003e营销跑批已有按阶段记录进度与复用结果的做法；人工确认较多的研发任务，则需要把已确认需求、阶段产物和待处理事项作为继续工作的依据。\u003c/p\u003e\n\u003cp\u003e进一步的检查点设计，需要关联当前数据、代码和规则版本。任务恢复时，先判断原有结果是否仍然有效，再确定继续、局部重跑或重新确认的范围。任务记忆保留当前工作理解，长期记忆只吸收经过确认、具有持续价值的信息。\u003c/p\u003e\n\u003ch4\u003ee. 卡片脚手架：按数据与代码关联控制变更\u003c/h4\u003e\n\u003cp\u003e从能力返回、节点输入输出、卡片变量、组件展示到用户事件，逐段核对数据的来源、类型、产生时机和消费位置。首次进入、返回修改和再次提交分别检查，防止旧结果被继续当作本次操作的有效结果。\u003c/p\u003e\n\u003cp\u003e修改组件、布局或流程时，同步检查事件、变量、绑定和后续去向，并对照源文件与交付产物保留差异。结构检查、视觉检查和实际业务运行分别记录，使局部代码调整能够回到完整流程中验证。\u003c/p\u003e"},{"id":"ai-architecture","kind":"edge","title":"人工推进与AI主导的开发协作","summary":"以任务组织与阶段推进为比较维度，展示人工推进与AI主导的开发协作，明确人员确认及程序、平台的执行职责。","graph_label":"架构演进","nodes":["ai","architecture"],"status":"practice","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003e当业务理解、知识查找和操作步骤主要依靠人员串联时，开发过程较依赖个人经验，跨环节交接和重复任务的复用成本较高。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e以“开发任务由谁组织和推进”为统一比较维度，观察需求理解、资料查找、方案形成和阶段交接如何完成。数仓、数据库、查询工具和业务平台按各自职责承担数据处理与实际执行。\u003c/p\u003e\n\u003cp\u003e保留既有数据处理与平台执行能力，将业务经验、知识资料、操作规范和检查规则组织为 AI 可以使用的能力。\u003c/p\u003e\n\u003cp\u003e由 AI 按 Skill 主导分析、设计、生成、检查与阶段推进，在关键节点提交材料；人员确认目标与方案、纠正业务歧义并验收结果，程序工具与平台承担确定性查询、校验和实际运行。\u003c/p\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 大数据开发：从工程师驱动到 AI 主导推进\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e场景：新增或改造一张大数据报表。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e对比环节\u003c/th\u003e\u003cth scope=\"col\"\u003e人工推进的开发协作\u003c/th\u003e\u003cth scope=\"col\"\u003eAI主导的开发协作\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e知识与来源\u003c/td\u003e\u003ctd\u003e工程师结合业务经验查资料、找来源，再整理判断依据\u003c/td\u003e\u003ctd\u003eAI 结合写入 Skill 的业务经验，主动查阅相关资料、知识库和元数据，形成来源分析材料，交工程师确认\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e需求分析\u003c/td\u003e\u003ctd\u003e工程师拆解指标、维度和业务口径，核对数据条件\u003c/td\u003e\u003ctd\u003eAI 按流程解析需求、核对字段覆盖和业务约束，形成分析结果，交工程师确认\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e设计与编码\u003c/td\u003e\u003ctd\u003e工程师设计加工链路、编写脚本并组织检查\u003c/td\u003e\u003ctd\u003eAI 基于已确认的分析材料形成设计，确认后生成脚本并按规则检查，工程师审阅关键结果\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e流程推进\u003c/td\u003e\u003ctd\u003e工程师持续串联分析、设计、编码和检查，逐步推动任务完成\u003c/td\u003e\u003ctd\u003eAI 按 Skill 主动衔接各阶段，在关键节点提交材料，并依据工程师的确认或修正继续推进\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e架构上的进步：\u003c/strong\u003e将业务经验沉淀为 AI 可使用的知识与工作流，由 AI 承担持续分析、材料产出和阶段推进，工程师集中负责关键判断与结果确认。\u003c/p\u003e\n\u003ch4\u003eb. 平台搭建：从人工操作到 AI 主导的脚手架搭建\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e场景：在业务平台上搭建流程与交互卡片。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e对比环节\u003c/th\u003e\u003cth scope=\"col\"\u003e人工推进的平台搭建\u003c/th\u003e\u003cth scope=\"col\"\u003eAI主导的脚手架搭建\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e需求与方案\u003c/td\u003e\u003ctd\u003e人员理解需求、查阅平台资料，设计业务流程和交互方式\u003c/td\u003e\u003ctd\u003eAI 结合 Skill 中的业务经验、平台规则和参考资料，梳理业务主线、数据流转与用户状态，形成方案交人员确认\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e搭建与配置\u003c/td\u003e\u003ctd\u003e人员在编辑器中逐项创建节点、选择组件，配置变量、事件和接口\u003c/td\u003e\u003ctd\u003eAI 根据已确认方案，按平台能力生成流程与卡片配置，组织组件、变量绑定和交互关系，交人员审阅\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e检查与修改\u003c/td\u003e\u003ctd\u003e人员逐处排查流程、数据、交互和配置之间的问题\u003c/td\u003e\u003ctd\u003eAI 依据规则检查结构与引用，对照平台真实导出核对配置；发现缺口或歧义时提交人员确认，再修改受影响内容\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e验证与迭代\u003c/td\u003e\u003ctd\u003e人员在平台中调试，并逐项手动调整\u003c/td\u003e\u003ctd\u003e人员在实际平台验证并反馈，AI 据此定位问题、修订方案和配置，持续推进至业务验收\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e架构上的进步：\u003c/strong\u003e将平台知识、搭建经验和检查规则沉淀为 Skill，由 AI 串联需求分析、方案设计、配置生成与反馈修改；平台承载实际运行，人员集中负责关键决策、方案确认和业务验收。\u003c/p\u003e\n\u003cp\u003e当前接口联调功能相对完善；其他搭建与交互能力，需要在平台进入生产后，通过更多实际业务场景持续验证和打磨。\u003c/p\u003e"},{"id":"ai-algorithm","kind":"edge","title":"从预设处理逻辑到 AI 自主决策","summary":"AI 既可承担指定的技术功能，也可在既定目标、工具和业务边界内，处理简单业务逻辑并自主选择实现方式，减少逐项预设与重复人工处理。","graph_label":"自主决策","nodes":["ai","algorithm"],"status":"practice","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003e传统业务处理链路依靠开发人员提前定义规则、分支、配置和工具调用方式。程序按照已有逻辑执行；遇到未覆盖的业务情况，通常需要人员补充判断、修改代码或扩展流程。\u003c/p\u003e\n\u003cp\u003eAI 带来的变化，是部分原先由人员完成的理解、判断和实现工作，也可以交给 AI。开发人员可以给出目标、业务边界和可用工具，由 AI 根据当前任务决定具体处理方式。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e1. AI 在算法中具有两种定位\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003e作为具体技术节点\u003c/strong\u003e：完成指定功能，例如语义匹配、信息抽取、分类或内容生成。输入输出目标明确，整体处理流程仍由外部程序组织。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e作为任务处理节点\u003c/strong\u003e：承担原先由人员负责的部分简单业务逻辑，理解目标、选择处理方法，并自主决定具体配置、代码生成和工具调用，根据返回结果继续调整。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e第二种定位，使 AI 从提供某项技术能力，扩展到参与决定任务如何实现。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. 最大的差异：从执行既定方法，扩展到自主组织实现方法\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e核心区别是处理逻辑由谁决定，以及实现路径是在开发时预先写好，还是由 AI 根据任务在运行时组织。\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e对比维度\u003c/th\u003e\u003cth scope=\"col\"\u003e传统预设逻辑\u003c/th\u003e\u003cth scope=\"col\"\u003eAI 作为技术节点\u003c/th\u003e\u003cth scope=\"col\"\u003eAI 作为任务处理节点\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e职责\u003c/td\u003e\u003ctd\u003e执行人员提前编写的处理逻辑\u003c/td\u003e\u003ctd\u003e实现人员指定的技术功能\u003c/td\u003e\u003ctd\u003e承担部分业务理解、判断与实现工作\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e实现路径\u003c/td\u003e\u003ctd\u003e规则、分支和处理方式在开发时定义\u003c/td\u003e\u003ctd\u003e模型完成指定判断，外围流程提前定义\u003c/td\u003e\u003ctd\u003eAI 根据当前目标与上下文，在运行时组织实现路径\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e配置与代码\u003c/td\u003e\u003ctd\u003e人员提前编写或设置生成规则\u003c/td\u003e\u003ctd\u003e按指定任务输出结果\u003c/td\u003e\u003ctd\u003eAI 判断需要什么配置、如何组织代码，并生成相应内容\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e工具调用\u003c/td\u003e\u003ctd\u003e调用条件、参数构造和衔接方式由程序定义\u003c/td\u003e\u003ctd\u003e由外围流程安排调用\u003c/td\u003e\u003ctd\u003eAI 根据任务和返回结果选择工具、构造参数并决定后续动作\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e新情况处理\u003c/td\u003e\u003ctd\u003e超出预设覆盖范围时，需要人员扩展逻辑\u003c/td\u003e\u003ctd\u003e在指定功能内处理新的表达和输入\u003c/td\u003e\u003ctd\u003e在已有知识与工具能力范围内，组合新的处理方式\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eAI 补充的核心能力，是让部分业务判断和实现路径能够在任务发生时形成，减少对逐项预设处理逻辑的依赖。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. AI 解决的核心痛点\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e传统处理方式高度依赖人员提前编写规则、实现路径和表达模板，未覆盖的情况需要人工补充。AI 既能补充具体技术能力，也能承担部分业务判断与实现工作，根据当前任务组织处理方式，从而扩大场景覆盖，减少规则枚举和重复人工处理。\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003e场景覆盖依赖逐项补规则\u003c/strong\u003e：AI 结合上下文处理表达变化和新的信息组合，减少部分映射、规则和模板的人工维护。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e方案实现依赖人工逐步判断\u003c/strong\u003e：AI 在既定目标与工具能力范围内，选择配置、组织代码和衔接工具，承担部分方案形成与实现工作。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e信息综合与表达依赖人工整理\u003c/strong\u003e：AI 综合多源资料，提炼当前任务的重点，形成适合业务使用的分析与表达。\u003c/li\u003e\u003c/ul\u003e\n\u003ch3\u003e示例\u003c/h3\u003e\n\u003ch4\u003ea. 数据智能体：AI 补充字段语义匹配\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e实际场景\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e报表分析需要核对候选来源表能否提供所需字段。业务需求中的名称，与字段字典、别名或注释存在表达差异，常规匹配后仍有部分需求项无法确认。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e传统处理方式\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e程序按照提前维护的名称和映射进行匹配。未覆盖的表达，需要工程师逐项判断，再扩充字典或匹配规则。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e项目中的实际处理\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli\u003e程序先完成常规匹配，返回未匹配的需求项，以及候选表中剩余字段的名称和说明。\u003c/li\u003e\u003cli\u003eAI 结合业务上下文和字段含义，判断是否存在同义、近义或业务上的对应关系，形成补充映射。\u003c/li\u003e\u003cli\u003e程序核对映射中的字段是否真实存在，形成逐表的候选覆盖统计；字段存在性与业务语义分别核对。\u003c/li\u003e\u003cli\u003e工程师结合对象、粒度、口径和使用条件复核映射，确认低置信度语义匹配，以及衍生指标是否能够按约定计入覆盖。\u003c/li\u003e\u003cli\u003e将确认后的覆盖结果交给后续设计；仍有歧义或缺失的内容保留为待确认事项，必要时调整候选范围或补充来源。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003e体现的能力差异\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAI 在明确的流程中承担语义匹配这一项技术功能。处理顺序和工具衔接已经确定，模型补充了人工规则尚未覆盖的表达。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAI 解决的痛点\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e固定映射容易遗漏不同表达，扩充映射又依赖人员逐项整理。AI 根据上下文补充语义映射，处理已有字典未覆盖的表达，减少人工核对与持续补规则的工作。\u003c/p\u003e\n\u003ch4\u003eb. 卡片脚手架：AI 自主选择提示交互的实现方案\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e实际场景\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e在已有报销类型选择卡片中，需要调整提示行为：用户选择暂未开放的类型时显示说明，切换到可用类型后隐藏，同时保留原有业务交互和页面样式。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e传统处理方式\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e开发人员读取卡片配置，查找点击事件和状态变量，判断是否需要增加状态，再编写显示条件、修改配置并检查影响范围。具体实现方式由开发人员选择。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e项目中的实际处理\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli\u003e\u003cstrong\u003e理解业务目标与修改边界。\u003c/strong\u003e AI 将需求拆成提示内容、显示时机和隐藏时机，并识别需要保留的原有事件、接口关系及样式。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e读取既有实现。\u003c/strong\u003e AI 检查卡片变量、事件和动作，发现原流程已有状态能够区分用户选择，可用于控制提示。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e决定实现方式。\u003c/strong\u003e 最终方案复用既有状态，由 AI 组织提示内容与显示条件的配置，沿用原有事件产生的状态变化。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e生成具体改动。\u003c/strong\u003e AI 修改对应组件的内容表达与隐藏条件，并保留原有变量、事件、动作和其他页面配置。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e检查修改结果。\u003c/strong\u003e 对照原始卡片核对改动范围，检查变量引用和配置结构，并记录需要在实际平台验证的交互状态。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003e体现的能力差异\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e用户给出业务目标和修改边界，具体采用哪个状态、怎样表达显示条件、修改哪些配置，由 AI 结合现有实现形成方案。\u003c/p\u003e\n\u003cp\u003eAI 在这里承担了原先由开发人员完成的一部分判断与实现工作。预先准备的是平台知识、工具和检查规则，本次具体的修改方案由 AI 根据任务组织出来。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAI 解决的痛点\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e简单业务改动也需要开发人员查配置、理解状态、选择实现方式并编写修改内容。AI 分析已有实现，自主选择状态复用和配置修改方案，承担部分原先由开发人员完成的判断与实现工作。\u003c/p\u003e\n\u003ch4\u003ec. 营销助手：AI 承担客户信息综合与沟通内容组织\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e实际场景\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e正在优化的营销助手，需要结合客户标签、交易流水、走访记录和产品资料，形成客户画像，并围绕已有候选产品生成推荐理由、电话话术和短信内容。\u003c/p\u003e\n\u003cp\u003e这些信息来源不同、表达方式不同。业务人员原本需要逐项阅读，再判断哪些信息值得关注、如何组织沟通内容。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e传统处理方式\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e程序能够按照规则计算行为特征、生成标签，并输出已有推荐模型提供的产品候选。采用固定模板生成内容时，需要提前规定标签组合、对应理由和表达方式；未覆盖的信息组合，仍需要业务人员补充理解和整理。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e项目中的实际处理\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli\u003e\u003cstrong\u003e程序整理可计算的信息。\u003c/strong\u003e 从标签和流水中加工资产变化、收支特点、活跃情况等行为信息，并形成明确的规则派生结果。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eAI 补充信息抽象。\u003c/strong\u003e 在已有规则结果基础上，对剩余标签进行语义整理与抽象，输出约定要求区分确定事实与推测性内容。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eAI 综合形成画像。\u003c/strong\u003e 将规则结果、抽象信息、静态资料、流水特征和走访记录共同组织为客户画像，提炼与当前任务相关的信息。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e围绕已有候选组织沟通内容。\u003c/strong\u003e 结合客户画像与产品资料，分别生成推荐理由、电话话术和短信内容，组织适合当前客户信息的沟通重点。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e保留阶段结果用于核对。\u003c/strong\u003e 将规则处理、画像与生成内容分别保留，便于检查关键描述的依据，以及问题最先出现在哪个环节。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003e体现的能力差异\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAI 承担部分原先由业务人员完成的综合阅读、信息解释与沟通内容组织工作，能够根据不同客户的信息组合形成相应分析和表达，减少逐种编写完整话术模板的需要。\u003c/p\u003e\n\u003cp\u003e当前处理阶段由程序组织，产品候选及顺序来自上游；AI 在相应阶段内承担信息综合与内容形成。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAI 解决的痛点\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e标签、流水和走访信息分散，业务人员需要综合阅读；固定模板难以覆盖不同客户的信息组合。AI 综合多源信息形成画像，围绕客户情况与已有候选产品组织沟通重点，减少人工整理和逐种编写话术模板的需要。\u003c/p\u003e"},{"id":"ai-cost","kind":"edge","title":"大模型计费与调用成本控制","summary":"拆分模型单价、输入输出、缓存和调用次数，从使用者角度比较套餐与 API 的参考花费，并按任务需要控制模型消耗。","graph_label":"模型成本","nodes":["ai","cost"],"status":"record","html":"\u003ch3\u003e问题\u003c/h3\u003e\n\u003cp\u003e大模型费用同时受到模型单价、输入输出量、缓存命中、调用次数和计费模式影响。\u003c/p\u003e\n\u003cp\u003e只比较月费、单价或 Token 总量，容易忽略实际使用结构：输入与输出可能采用不同费率，缓存命中与未命中的输入费用不同，多阶段调用和失败重试也会累积模型消耗。\u003c/p\u003e\n\u003ch3\u003e方案\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e1. 拆清大模型费用的组成\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003e成本维度\u003c/th\u003e\u003cth scope=\"col\"\u003e需要看清什么\u003c/th\u003e\u003cth scope=\"col\"\u003e对应的控制方式\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e模型单价\u003c/td\u003e\u003ctd\u003e不同模型、版本及服务模式对应的费率\u003c/td\u003e\u003ctd\u003e用相同任务比较效果与费用，在满足任务要求后选择合适配置\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e输入 Token\u003c/td\u003e\u003ctd\u003e系统提示、历史对话、知识片段和工具返回内容都会进入输入\u003c/td\u003e\u003ctd\u003e合并重复说明，按任务提供必要上下文，控制无关内容\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e输出 Token\u003c/td\u003e\u003ctd\u003e实际生成内容的长度，以及对应输出费率\u003c/td\u003e\u003ctd\u003e明确回答范围，按任务设置长度要求与输出上限\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e缓存计费\u003c/td\u003e\u003ctd\u003e缓存输入、普通输入及适用的缓存写入费用分别计算\u003c/td\u003e\u003ctd\u003e组织稳定前缀，观察实际命中情况，并按服务计费规则核算\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e调用次数\u003c/td\u003e\u003ctd\u003e多阶段处理、重复生成和失败重试形成累计费用\u003c/td\u003e\u003ctd\u003e复用仍然有效的模型结果，减少重复处理相同信息\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e使用与计费模式\u003c/td\u003e\u003ctd\u003e套餐、按量 API，以及适用的长上下文、加速、批量或时段条件\u003c/td\u003e\u003ctd\u003e按实际使用方式核算，比较时保留相应条件\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eAPI 费用按照各类实际用量分别计算，再汇总普通输入、缓存输入、输出及其他适用的模型计费项。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. 从普通用户角度比较使用费用\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e统一查看每使用 1 亿 Token 的参考花费，将套餐的个人估算摊销和API按量测算放在同一张图、同一标尺上。\u003c/p\u003e\n\u003cfigure class=\"model-price-chart\" aria-label=\"套餐与API每亿Token参考花费同图对比\"\u003e\n\u003cfigcaption\u003e每用1亿 Token，不同方式的参考花费\u003c/figcaption\u003e\n\u003cdiv class=\"model-price-unit\"\u003e人民币 / 1亿 Token · 同一线性标尺\u003c/div\u003e\n\u003cdiv class=\"model-price-axis\" aria-hidden=\"true\"\u003e\u003cspan\u003e0\u003c/span\u003e\u003cspan\u003e¥10,074.75\u003c/span\u003e\u003cspan\u003e¥20,149.50\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"model-price-rows\" role=\"list\"\u003e\n\u003cdiv class=\"model-price-row\" role=\"listitem\" aria-label=\"GPT-6 Sol 套餐 · 估算5亿/月摊销：每1亿Token参考花费26.87元。个人月费约134.33元，按个人估算月度可用量区间上端5亿Token摊销，非官方固定额度\" data-price=\"26.87\"\u003e\u003cdiv class=\"model-price-head\"\u003e\u003cspan class=\"model-price-label\"\u003eGPT-6 Sol 套餐 · 估算5亿/月摊销\u003c/span\u003e\u003cspan class=\"model-price-value\"\u003e¥26.87\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"model-price-track\" aria-hidden=\"true\"\u003e\u003cspan class=\"model-price-fill\" style=\"width:0.13335318%\"\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"model-price-row\" role=\"listitem\" aria-label=\"GPT-6 Sol 套餐 · 估算3亿/月摊销：每1亿Token参考花费44.78元。同一套餐，按个人估算月度可用量区间下端3亿Token摊销，输
